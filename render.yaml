services:
  - type: web
    name: ezz-pharmacy-secure
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python tools/build_assets.py
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ezz-pharmacy-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
