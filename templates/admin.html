<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين - صيدلية عز الصحة</title><style>body{font-family:Tahoma,Arial;background:#f5fafb;color:#17324d;margin:0}.wrap{max-width:1100px;margin:30px auto;padding:20px}.panel{background:#fff;border:1px solid #d9e7ea;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #123f7a14}h1,h2{color:#123f7a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}input{padding:10px;border:1px solid #ccd;border-radius:9px;box-sizing:border-box}button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;font-weight:bold}.primary{background:#0b8f9b;color:white}.danger{background:#d83b3b;color:white}.secondary{background:#edf3f5}.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.perm{border:1px solid #d9e7ea;padding:9px;border-radius:9px}.user{border-top:1px solid #e4eef0;padding:15px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.muted{color:#6c7f8a;font-size:13px}.msg{min-height:22px;font-weight:bold}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><h1>👑 لوحة إدارة المستخدمين</h1><p class="muted">إدارة الموظفين والصلاحيات. التغييرات تطبق على مستوى الخادم.</p><div class="actions"><button class="secondary" onclick="location.href='/'">العودة للنظام</button><button class="secondary" onclick="location.href='/logout'">تسجيل الخروج</button></div></div><div class="grid"><div class="panel"><h2>➕ إضافة مستخدم</h2><div class="field"><label>اسم المستخدم</label><input id="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><h3>الصلاحيات</h3><div id="new-perms" class="perms"></div><button class="primary" onclick="addUser()">إضافة المستخدم</button><div id="msg" class="msg"></div></div><div class="panel"><h2>👥 المستخدمون</h2><div id="users">جارِ التحميل...</div></div></div></div><script>const PERMS={{ permissions|tojson }};const pbox=(id,selected=[])=>{document.getElementById(id).innerHTML=PERMS.map(([k,l])=>`<label class="perm"><input type="checkbox" value="${k}" ${selected.includes(k)?'checked':''}> ${l}</label>`).join('')};pbox('new-perms');const checked=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value);async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}async function load(){try{let d=await api('/api/admin/users');document.getElementById('users').innerHTML=d.users.map(u=>`<div class="user"><b>${esc(u.username)}</b> <span class="muted">${u.active?'نشط':'معطل'}</span><div id="p-${u.id}" class="perms"></div><div class="field"><label>كلمة مرور جديدة (اختياري)</label><input id="pw-${u.id}" type="password"></div><div class="actions"><button class="primary" onclick="save(${u.id})">حفظ</button><button class="secondary" onclick="toggle(${u.id},${!u.active})">${u.active?'تعطيل':'تفعيل'}</button><button class="danger" onclick="delUser(${u.id})">حذف</button></div></div>`).join('');d.users.forEach(u=>pbox('p-'+u.id,u.permissions))}catch(e){document.getElementById('users').textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function addUser(){let m=document.getElementById('msg');try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value,permissions:checked('new-perms')})});m.textContent='تمت إضافة المستخدم';document.getElementById('username').value='';document.getElementById('password').value='';pbox('new-perms');load()}catch(e){m.textContent=e.message}}async function save(id){try{await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({permissions:checked('p-'+id),password:document.getElementById('pw-'+id).value})});load()}catch(e){alert(e.message)}}async function toggle(id,active){try{await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({permissions:checked('p-'+id),active})});load()}catch(e){alert(e.message)}}async function delUser(id){if(!confirm('هل أنت متأكد من حذف المستخدم؟'))return;try{await api('/api/admin/users/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}load();</script></body></html>
