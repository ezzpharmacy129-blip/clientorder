<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - صيدلية عز الصحة</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:Tahoma,Arial;color:#18324a}.card{width:min(400px,90vw);background:#fff;padding:30px;border-radius:20px;box-shadow:0 15px 50px #0002}h1{text-align:center}input,button{width:100%;padding:12px;margin-top:10px;box-sizing:border-box;border-radius:10px}input{border:1px solid #ccd7e2}button{border:0;background:#0b8f9b;color:#fff;font-weight:bold}.hint{font-size:12px;color:#6c7f8a;text-align:center;margin-top:15px}</style></head><body><div class="card"><h1>صيدلية عز الصحة</h1><p style="text-align:center">تسجيل الدخول إلى النظام</p><form method="post"><input name="username" placeholder="اسم المستخدم" autocomplete="username" required><input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><button>دخول</button></form><div class="hint">الوصول مخصص للمستخدمين المصرح لهم</div></div></body></html>
