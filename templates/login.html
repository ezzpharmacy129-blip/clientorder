<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول - صيدلية عز الصحة</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5fafb;font-family:Tahoma,Arial;color:#17324d}.card{width:min(420px,92vw);background:#fff;padding:30px;border-radius:18px;box-shadow:0 15px 50px #0002;border:1px solid #d9e7ea}h1{text-align:center}label{display:block;margin:12px 0 6px;font-weight:700}input{width:100%;padding:12px;border:1px solid #d9e7ea;border-radius:9px;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#0b8f9b;color:#fff;font-weight:700;font-size:16px}</style></head><body><div class="card"><h1>صيدلية عز الصحة</h1><p style="text-align:center;color:#6c7f8a">تسجيل الدخول للنظام</p><form method="post"><label>اسم المستخدم</label><input name="username" autocomplete="username" required><label>كلمة المرور</label><input type="password" name="password" autocomplete="current-password" required><button type="submit">دخول</button></form></div></body></html>
