name: Validate application

on:
  push:
    branches: [p0-2-data-safe-undo]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  p0_2_final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m compileall -q app.py db.py cloud_db.py tests/test_p0_item_update.py tests/test_p0_2_undo.py
          node --check static/app.js
          git diff --check
      - name: P0.1/P0.2 regression tests
        run: python -m unittest -v tests/test_p0_item_update.py tests/test_p0_2_undo.py
