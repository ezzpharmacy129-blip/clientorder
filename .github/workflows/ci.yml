name: Validate application

on:
  push:
    branches: [main, p0-3-import-safety]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ezz_ci:ezz_ci@localhost:5432/ezz_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL if needed
        shell: bash
        run: |
          if ! pg_isready -h localhost -p 5432 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-contrib
            sudo systemctl start postgresql || sudo service postgresql start
          fi
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'ezz_ci') THEN CREATE ROLE ezz_ci LOGIN PASSWORD 'ezz_ci'; ELSE ALTER ROLE ezz_ci WITH LOGIN PASSWORD 'ezz_ci'; END IF; END $$;"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='ezz_test'" | grep -q 1 || sudo -u postgres createdb -O ezz_ci ezz_test
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply P0.3 implementation
        run: python tools/apply_p0_3.py
      - name: Compile Python files
        run: python -m compileall -q app.py db.py cloud_db.py sitecustomize.py auth_bootstrap.py auth_pg.py auth_security_extensions.py admin_state_controls.py data_export.py csrf_protection.py tests/test_csrf_protection.py tests/test_p0_item_update.py tests/test_p0_2_undo.py tests/test_p0_3_import_safety.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: Run CSRF protection tests
        run: python -m unittest -v tests/test_csrf_protection.py
      - name: Run login rate limit tests
        run: python -m unittest -v tests/test_login_rate_limit.py
      - name: Run authorization policy tests
        run: python -m unittest -v tests/test_authorization_policy.py
      - name: Run workflow policy tests
        run: python -m unittest -v tests/test_workflow_policy.py
      - name: Run P0 data safety regression tests
        run: python -m unittest -v tests/test_p0_item_update.py tests/test_p0_2_undo.py tests/test_p0_3_import_safety.py
      - name: Verify users dashboard core integration
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('templates/index.html').read_text(encoding='utf-8')
          j=Path('static/app.js').read_text(encoding='utf-8')
          c=Path('static/style.css').read_text(encoding='utf-8')
          assert t.count('id="users-nav-btn"') == 1
          assert t.count('id="view-users"') == 1
          assert j.count('EZZ_CORE_USERS_DASHBOARD_') == 1
          assert c.count('EZZ_CORE_USERS_DASHBOARD_CSS_') == 1
          print('USERS CORE INTEGRATION VERIFIED')
          PY
      - name: Commit verified P0.3 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_db.py
          if git diff --cached --quiet; then
            echo 'No P0.3 implementation changes to commit.'
            exit 0
          fi
          git commit -m 'P0.3 harden import validation and safety backup'
          git push
