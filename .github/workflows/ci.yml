name: Validate application

on:
  push:
    branches: [main, p0-2-data-safe-undo]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare P0.2 patch and tests on the staged branch
        if: github.ref == 'refs/heads/p0-2-data-safe-undo'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          wf=Path('.github/workflows/_p0_2_apply.yml').read_text(encoding='utf-8')
          ps=wf.index("          python - <<'PY'", wf.index('Apply P0.2 fail-closed patch'))+len("          python - <<'PY'\n")
          pe=wf.index("          PY", ps)
          exec(compile(dedent(wf[ps:pe]), '<p0_2_patch>', 'exec'), {})
          ts=wf.index("          cat > tests/test_p0_undo_safety.py <<'PY'")+len("          cat > tests/test_p0_undo_safety.py <<'PY'\n")
          te=wf.index("          PY", ts)
          test=dedent(wf[ts:te])
          test=test.replace('from cloud_db import CloudDB\n','from cloud_db import CloudDB\nimport psycopg\npsycopg.Binary = lambda value: value\n',1)
          marker='\n\nclass SourceGuardTest(unittest.TestCase):\n'
          add='''\n    def test_undo_removes_new_image_when_snapshot_had_no_image(self):\n        before = copy.deepcopy(self.c.items)\n        snap = copy.deepcopy(before)\n        snap['A']['image_path'] = ''\n        self.c.items['A']['image_path'] = 'O/A-new.png'\n        self.c.images['O/A-new.png'] = {'image_path':'O/A-new.png','order_id':'O','item_id':'A','filename':'A-new.png','content_type':'image/png','data':b'NEW','created_at':'T3'}\n        snapshot={'order':copy.deepcopy(self.c.orders['O']),'items':[snap['A'],snap['B']]}\n        self.c.undo.append({'undo_id':'U1','order_id':'O','action':'إضافة صورة للمنتج','snapshot_json':json.dumps(snapshot,ensure_ascii=False),'created_at':'T4','undone_at':'','user_name':'tester'})\n        out=self.db.undo_last('O',user='tester')\n        got={x['Item_ID']:x for x in out['order']['Items']}\n        self.assertEqual(got['A']['Image_Path'],'')\n        self.assertNotIn('O/A-new.png',self.c.images)\n'''
          test=test.replace(marker,add+marker,1)
          Path('tests/test_p0_undo_safety.py').write_text(test,encoding='utf-8')

          code=Path('cloud_db.py').read_text(encoding='utf-8')
          old="""                    expected=str(item.get('Image_Path') or ''); actual=str(current_by_id[item_id].get('Image_Path') or '')\n                    if expected!=actual and item_id not in images_by_item:\n                        raise ValueError(f'لا يمكن التراجع بأمان عن الصورة المرتبطة بالمنتج {item_id}: بيانات الصورة السابقة غير محفوظة')\n"""
          new="""                    expected=str(item.get('Image_Path') or ''); actual=str(current_by_id[item_id].get('Image_Path') or '')\n                    if expected != actual:\n                        if expected:\n                            if item_id not in images_by_item:\n                                raise ValueError(f'لا يمكن التراجع بأمان عن الصورة المرتبطة بالمنتج {item_id}: بيانات الصورة السابقة غير محفوظة')\n                        else:\n                            conn.execute('DELETE FROM item_images WHERE order_id=%s AND item_id=%s',(str(order_id),item_id))\n"""
          if code.count(old)!=1: raise SystemExit('FAIL CLOSED: image safety block')
          Path('cloud_db.py').write_text(code.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run focused P0.1 and P0.2 regression tests
        id: p0reg
        if: github.ref == 'refs/heads/p0-2-data-safe-undo'
        run: python -m unittest -v tests/test_p0_item_update.py tests/test_p0_undo_safety.py
      - name: Compile Python files
        run: python -m compileall -q app.py db.py cloud_db.py sitecustomize.py auth_bootstrap.py auth_pg.py auth_security_extensions.py admin_state_controls.py data_export.py csrf_protection.py tests/test_csrf_protection.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: Run CSRF protection tests
        run: python -m unittest -v tests/test_csrf_protection.py
      - name: Run login rate limit tests
        run: python -m unittest -v tests/test_login_rate_limit.py
      - name: Run authorization policy tests
        run: python -m unittest -v tests/test_authorization_policy.py
      - name: Run workflow policy tests
        run: python -m unittest -v tests/test_workflow_policy.py
      - name: Verify users dashboard core integration
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('templates/index.html').read_text(encoding='utf-8')
          j=Path('static/app.js').read_text(encoding='utf-8')
          c=Path('static/style.css').read_text(encoding='utf-8')
          assert t.count('id="users-nav-btn"') == 1
          assert t.count('id="view-users"') == 1
          assert j.count('EZZ_CORE_USERS_DASHBOARD_') == 1
          assert c.count('EZZ_CORE_USERS_DASHBOARD_CSS_') == 1
          print('USERS CORE INTEGRATION VERIFIED')
          PY
      - name: Commit verified P0.2 and restore CI on the staged branch
        if: always() && github.ref == 'refs/heads/p0-2-data-safe-undo' && steps.p0reg.outcome == 'success'
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: Validate application

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            syntax:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.14"
                - name: Install dependencies
                  run: python -m pip install -r requirements.txt
                - name: Compile Python files
                  run: python -m compileall -q app.py db.py cloud_db.py sitecustomize.py auth_bootstrap.py auth_pg.py auth_security_extensions.py admin_state_controls.py data_export.py csrf_protection.py tests/test_csrf_protection.py
                - name: Validate JavaScript syntax
                  run: node --check static/app.js
                - name: Run CSRF protection tests
                  run: python -m unittest -v tests/test_csrf_protection.py
                - name: Run login rate limit tests
                  run: python -m unittest -v tests/test_login_rate_limit.py
                - name: Run authorization policy tests
                  run: python -m unittest -v tests/test_authorization_policy.py
                - name: Run workflow policy tests
                  run: python -m unittest -v tests/test_workflow_policy.py
                - name: Verify users dashboard core integration
                  run: |
                    python - <<'PY'
                    from pathlib import Path
                    t=Path('templates/index.html').read_text(encoding='utf-8')
                    j=Path('static/app.js').read_text(encoding='utf-8')
                    c=Path('static/style.css').read_text(encoding='utf-8')
                    assert t.count('id="users-nav-btn"') == 1
                    assert t.count('id="view-users"') == 1
                    assert j.count('EZZ_CORE_USERS_DASHBOARD_') == 1
                    assert c.count('EZZ_CORE_USERS_DASHBOARD_CSS_') == 1
                    print('USERS CORE INTEGRATION VERIFIED')
                    PY
          EOF
          rm -f .github/workflows/_p0_2_apply.yml .github/workflows/_p0_2_repair.yml .github/workflows/_p0_2_repair2.yml .github/workflows/p0_2_finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud_db.py tests/test_p0_undo_safety.py .github/workflows/ci.yml .github/workflows/_p0_2_apply.yml .github/workflows/_p0_2_repair.yml .github/workflows/_p0_2_repair2.yml .github/workflows/p0_2_finalizer.yml
          git commit -m "feat: close P0.2 data-safe undo"
          git push
