name: Validate application

on:
  push:
    branches: [main, p0-4-backup-restore-safety]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ezz_ci:ezz_ci@localhost:5432/ezz_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: p0-4-backup-restore-safety
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PostgreSQL if needed
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-contrib
          fi
          sudo systemctl start postgresql || sudo service postgresql start || true
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ezz_ci LOGIN PASSWORD 'ezz_ci';" || true
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE ezz_ci WITH LOGIN PASSWORD 'ezz_ci';"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='ezz_test'" | grep -q 1 || sudo -u postgres createdb -O ezz_ci ezz_test
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply P0.4 implementation
        run: python tools/apply_p0_4.py
      - name: Compile Python files
        run: python -m compileall -q app.py db.py cloud_db.py tests/test_p0_item_update.py tests/test_p0_2_undo.py tests/test_p0_3_import_safety.py tests/test_p0_4_backup_restore.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: Run P0.1 and P0.2 regression tests
        run: env -u DATABASE_URL python -m unittest -v tests/test_p0_item_update.py tests/test_p0_2_undo.py
      - name: Run P0.3 import safety tests
        run: python -m unittest -v tests/test_p0_3_import_safety.py
      - name: Run P0.4 backup restore tests
        run: python -m unittest -v tests/test_p0_4_backup_restore.py
      - name: Commit verified P0.4 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_db.py
          if git diff --cached --quiet; then
            echo 'P0.4 implementation already present.'
            exit 0
          fi
          git commit -m 'P0.4 harden backup restore with undo image roundtrip'
          git push origin HEAD:p0-4-backup-restore-safety
