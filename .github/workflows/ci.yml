name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py db.py cloud_db.py auth_pg.py auth_security_extensions.py authorization_policy.py data_export.py csrf_protection.py login_rate_limit.py workflow_policy.py tests/test_csrf_protection.py tests/test_login_rate_limit.py tests/test_authorization_policy.py tests/test_workflow_policy.py tests/test_p0_5_destructive_ops.py tests/test_p0_6_audit_traceability.py tests/test_p1_1_orders_core_contract.py
      - name: Validate JavaScript syntax
        run: node --check static/app.js
      - name: Run CSRF protection tests
        run: python -m unittest -v tests/test_csrf_protection.py
      - name: Run login rate limit tests
        run: python -m unittest -v tests/test_login_rate_limit.py
      - name: Run authorization policy tests
        run: python -m unittest -v tests/test_authorization_policy.py
      - name: Run P0.5 destructive operation safety tests
        run: python -m unittest -v tests/test_p0_5_destructive_ops.py
      - name: Run P0.6 audit traceability tests
        run: python -m unittest -v tests/test_p0_6_audit_traceability.py
      - name: Run P1.1 Orders Core contract tests
        run: python -m unittest -v tests/test_p1_1_orders_core_contract.py
      - name: Run P1.3 dashboard source tests
        run: python -m unittest -v tests/test_p1_3_dashboard_source.py
      - name: Run workflow policy tests
        run: python -m unittest -v tests/test_workflow_policy.py
      - name: Verify P0 authorization files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('authorization_policy.py'),
              Path('gunicorn.conf.py'),
              Path('tests/test_authorization_policy.py'),
              Path('tests/test_p0_5_destructive_ops.py'),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'Missing required P0 authorization files: {missing}')
          print('P0 AUTHORIZATION FILES VERIFIED')
          PY
