name: P0.2 final verification

on:
  push:
    branches: [p0-2-data-safe-undo]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m compileall -q app.py db.py cloud_db.py tests/test_p0_item_update.py tests/test_p0_2_undo.py
          node --check static/app.js
          git diff --check
      - name: P0.2 source guards
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('cloud_db.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          undo=next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name=='undo_last')
          sql=[]
          for n in ast.walk(undo):
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute) and n.func.attr=='execute' and n.args and isinstance(n.args[0],ast.Constant) and isinstance(n.args[0].value,str):
                  sql.append(n.args[0].value.upper())
          assert 'DELETE FROM ORDER_ITEMS WHERE ORDER_ID=%S' not in sql
          assert 'UPDATE ORDER_ITEMS SET PRODUCT_NAME=%S,QUANTITY=%S,IMAGE_PATH=' in sql
          assert any(s.startswith('DELETE FROM ORDER_ITEMS WHERE ITEM_ID=%S AND ORDER_ID=%S') for s in sql)
          assert 'CREATE TABLE IF NOT EXISTS undo_item_images' in source
          assert 'image_item_ids=overlap' in source
          assert "'إضافة صورة للمنتج'" in source
          assert "'حذف صورة المنتج'" in source
          print('P0.2 SOURCE GUARDS: PASS')
          PY
      - name: P0.1 and P0.2 regression tests
        run: python -m unittest -v tests/test_p0_item_update.py tests/test_p0_2_undo.py
      - name: Remove temporary verifier after success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p0_2_verify.yml
          git commit -m 'chore: remove temporary P0.2 verifier [skip ci]'
          git push
