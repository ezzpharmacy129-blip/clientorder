name: P0.2 final verification

on:
  push:
    branches: [p0-2-data-safe-undo]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m compileall -q app.py db.py cloud_db.py tests/test_p0_item_update.py tests/test_p0_2_undo.py
          node --check static/app.js
          git diff --check
      - name: P0.2 source guards
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('cloud_db.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          def method(name):
              return next(n for n in ast.walk(tree) if isinstance(n,ast.FunctionDef) and n.name==name)
          undo_node=method('undo_last')
          undo_source=ast.get_source_segment(source, undo_node) or ''
          update_source=ast.get_source_segment(source, method('update_order')) or ''
          image_add_source=ast.get_source_segment(source, method('set_item_image')) or ''
          image_del_source=ast.get_source_segment(source, method('delete_item_image')) or ''
          normalized=undo_source.upper().replace('\\n',' ')
          assert 'DELETE FROM ORDER_ITEMS WHERE ORDER_ID=' not in normalized, 'undo_last must not delete all order_items'
          assert 'UPDATE ORDER_ITEMS SET PRODUCT_NAME=%S,QUANTITY=%S,IMAGE_PATH=' in normalized, 'undo_last must reconcile existing items by update'
          assert 'DELETE FROM ORDER_ITEMS WHERE ITEM_ID=%S AND ORDER_ID=%S' in normalized, 'undo_last must only delete specific absent items'
          assert 'CREATE TABLE IF NOT EXISTS undo_item_images' in source
          assert 'image_item_ids=overlap' in update_source
          assert "self._add_undo(conn, order_id, 'إضافة صورة للمنتج'" in image_add_source
          assert "self._add_undo(conn, order_id, 'حذف صورة المنتج'" in image_del_source
          assert 'snapshot=self._snapshot(conn, order_id)' in image_add_source
          assert 'snapshot=self._snapshot(conn, order_id)' in image_del_source
          print('P0.2 SOURCE GUARDS: PASS')
          PY
      - name: P0.1 and P0.2 regression tests
        run: python -m unittest -v tests/test_p0_item_update.py tests/test_p0_2_undo.py
      - name: Remove temporary verifier after success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p0_2_verify.yml
          git commit -m 'chore: remove temporary P0.2 verifier [skip ci]'
          git push
