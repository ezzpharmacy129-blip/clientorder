  function view(){if(document.getElementById('view-'+V))return;const m=document.querySelector('main.app-main');if(!m)return;const s=document.createElement('section');s.id='view-'+V;s.className='view';s.innerHTML=`<div class="panel"><div class="vip-hero"><div class="vip-title"><div class="vip-icon">⭐</div><div><h2>العملاء المميزين</h2><p class="vip-sub">سجل عروض العملاء المميزين وتابع استلام العرض بسرعة.</p></div></div><button class="btn btn-primary vip-add" id="vip-add-btn">+ إضافة عميل مميز</button></div><div class="vip-stats"><div class="vip-stat"><strong id="vip-total">0</strong><span>إجمالي العملاء</span></div><div class="vip-stat"><strong id="vip-pending">0</strong><span>قيد الانتظار</span></div><div class="vip-stat"><strong id="vip-received">0</strong><span>تم استلام العرض</span></div></div><div class="panel-header"><div><h3>قائمة العملاء</h3></div><input id="vip-search" class="vip-search" placeholder="ابحث باسم العميل أو المنتج..."></div><div id="vip-list" class="vip-grid"><div class="empty-state">جارِ التحميل...</div></div></div><div id="vip-form-modal" class="modal-overlay hidden"><div class="modal small"><div class="modal-header"><h3>⭐ إضافة عميل مميز</h3><button class="modal-close" id="vip-form-close">✕</button></div><div class="modal-body"><p class="vip-modal-note">رقم الهاتف اختياري. الحالة تبدأ تلقائيًا: قيد الانتظار.</p><form id="vip-form" class="order-form"><div class="form-row"><label>اسم العميل <span class="req">*</span></label><input name="name" required></div><div class="form-row"><label>رقم الهاتف</label><input name="phone" type="tel" placeholder="اختياري"></div><div class="form-row"><label>منتج العرض <span class="req">*</span></label><input name="offer_product" required></div><div class="form-row"><label>سعر العرض <span class="req">*</span></label><input name="offer_price" type="number" min="0" step="0.01" required></div><div class="form-actions"><button class="btn btn-primary" type="submit">حفظ العميل</button><button class="btn btn-secondary" type="button" id="vip-form-cancel">إلغاء</button></div></form></div></div></div>`;m.appendChild(s);document.getElementById('vip-add-btn').onclick=()=>document.getElementById('vip-form-modal').classList.remove('hidden');document.getElementById('vip-form-close').onclick=close;document.getElementById('vip-form-cancel').onclick=close;document.getElementById('vip-form-modal').onclick=e=>{if(e.target.id==='vip-form-modal')close()};document.getElementById('vip-form').onsubmit=save;document.getElementById('vip-search').oninput=render}
