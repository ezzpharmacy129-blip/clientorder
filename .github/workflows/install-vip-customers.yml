atus.pending{background:#fff5d6;color:#8a6500}.vip-status.received{background:#e6f7ee;color:#16704a}#view-vip-customers .vip-actions{margin-top:14px;display:flex;gap:8px}#view-vip-customers .vip-actions .btn{flex:1}#view-vip-customers .vip-modal-note{font-size:13px;color:#6b7f8d;margin-top:-4px;margin-bottom:14px}#view-vip-customers .vip-search{max-width:320px}@media(max-width:700px){#view-vip-customers .vip-hero{align-items:stretch;flex-direction:column}#view-vip-customers .vip-add{width:100%}#view-vip-customers .vip-stats{grid-template-columns:1fr 1fr}#view-vip-customers .vip-stats .vip-stat:last-child{grid-column:1/-1}#view-vip-customers .vip-search{max-width:none;width:100%}}`;document.head.appendChild(s)}
