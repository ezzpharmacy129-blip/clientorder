name: P1 temporary admin credentials patch

on:
  push:
    branches: [p1-admin-credentials-persistent]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch auth_pg seed behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path("auth_pg.py")
          text = p.read_text(encoding="utf-8")
          old = '''                conn.execute("""INSERT INTO users(user_id,username,name,password_hash,role,active,created_at,last_login)\n                    VALUES(%s,%s,%s,%s,'admin',TRUE,%s,NULL)\n                    ON CONFLICT(username) DO UPDATE SET\n                        name=EXCLUDED.name,\n                        password_hash=EXCLUDED.password_hash,\n                        role='admin',\n                        active=TRUE""", (str(uuid.uuid4()), au, au, hash_password(ap), now_str()))'''
          new = '''                conn.execute("""INSERT INTO users(user_id,username,name,password_hash,role,active,created_at,last_login)\n                    VALUES(%s,%s,%s,%s,'admin',TRUE,%s,NULL)\n                    ON CONFLICT(username) DO NOTHING""", (str(uuid.uuid4()), au, au, hash_password(ap), now_str()))'''
          if old not in text:
              raise SystemExit("Expected admin credential upsert block not found; aborting.")
          text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth_pg.py
          git commit -m 'fix(P1): preserve production admin credentials on startup'
          git push origin HEAD:p1-admin-credentials-persistent

# temporary branch-only helper; delete after patch is applied
