name: Fix backup screen and restore UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace loadBackups safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('static/app.js')
          text = p.read_text(encoding='utf-8')
          marker = 'EZZ_LOADBACKUPS_SAFE_V2'
          if marker not in text:
              start = text.find('async function loadBackups(){')
              end = text.find('function initOrders', start)
              if start < 0 or end < 0:
                  raise SystemExit('loadBackups function boundaries not found')
              replacement = r'''async function loadBackups(){
  // EZZ_LOADBACKUPS_SAFE_V2
  const root=document.getElementById("view-backups");
  if(!root) return;
  let b=document.getElementById("backups-table-body");
  if(!b){
    const table=root.querySelector(".table-wrap table");
    if(table){ b=document.createElement("tbody"); b.id="backups-table-body"; table.appendChild(b); }
  }
  if(!b){
    b=document.createElement("div");
    b.id="backups-table-body";
    b.className="empty-state";
    root.appendChild(b);
  }
  try{
    const d=await apiFetch("/api/backups");
    const rows=Array.isArray(d?.backups)?d.backups:[];
    if(b.tagName.toLowerCase()==="tbody"){
      b.innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.reason)}</td><td>${esc(x.filename)}</td><td>${x.size_kb} KB</td><td><button class="btn btn-outline btn-sm restore-btn" data-file="${esc(x.filename)}">استعادة</button></td></tr>`).join(""): '<tr><td colspan="5" class="empty-state">لا توجد نسخ احتياطية</td></tr>';
    }else{
      b.innerHTML=rows.length?rows.map(x=>`<div class="backup-row"><b>${esc(x.created_at)}</b> — ${esc(x.filename)} — ${x.size_kb} KB <button class="btn btn-outline btn-sm restore-btn" data-file="${esc(x.filename)}">استعادة</button></div>`).join(""):"لا توجد نسخ احتياطية";
    }
    b.querySelectorAll(".restore-btn").forEach(btn=>btn.onclick=()=>openConfirm(`استعادة النسخة ${btn.dataset.file}؟ سيتم حفظ نسخة تلقائية من الحالة الحالية أولًا.`,async()=>{try{await apiFetch("/api/backups/restore",{method:"POST",body:JSON.stringify({filename:btn.dataset.file})});toast("تمت الاستعادة");refresh();loadBackups()}catch(e){toast(e.message,"error")}}));
  }catch(e){
    console.error("loadBackups failed",e);
    if(b.tagName.toLowerCase()==="tbody") b.innerHTML='<tr><td colspan="5" class="empty-state">تعذر تحميل النسخ الاحتياطية حاليًا. يمكنك استخدام أزرار الاستيراد والتصدير والاستعادة أعلاه.</td></tr>';
    else b.textContent='تعذر تحميل النسخ الاحتياطية حاليًا.';
    try{toast(e.message||"تعذر تحميل النسخ الاحتياطية","error")}catch(_e){}
  }
}
'''
              text = text[:start] + replacement + text[end:]
              p.write_text(text, encoding='utf-8')

      - name: Install safe recovery action
        shell: python
        run: |
          from pathlib import Path
          p = Path('static/app.js')
          text = p.read_text(encoding='utf-8')
          marker = 'EZZ_RESTORE_PRE_ROLLBACK_V2'
          if marker not in text:
              patch = r'''

// EZZ_RESTORE_PRE_ROLLBACK_V2
window.ezzRestorePreRollback = async function(){
  const button=document.getElementById('export-postrollback-btn');
  if(!window.confirm('سيتم حفظ نسخة احتياطية من البيانات الحالية أولًا، ثم استعادة آخر نسخة قبل الـRollback. هل تريد المتابعة؟')) return false;
  if(button){button.disabled=true;button.textContent='جاري الاستعادة...';}
  try{
    const r=await fetch('/api/data/restore-pre-rollback',{method:'POST',credentials:'same-origin'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'تعذر استعادة البيانات');
    alert('تمت استعادة بيانات ما قبل الـRollback بنجاح ✅');
    window.location.reload();
  }catch(e){
    alert(e.message||'تعذر استعادة البيانات');
    if(button){button.disabled=false;button.textContent='🛟 استعادة بيانات ما قبل الـRollback';}
  }
  return false;
};
'''
              p.write_text(text.rstrip()+patch+'\n',encoding='utf-8')

      - name: Commit patched UI
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix backup management crash and safe restore action'
          git push
