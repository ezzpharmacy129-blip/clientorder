name: Repair item-state patch workflow safely

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repair broken quoting
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/item-state-fix.yml')
          text = p.read_text(encoding='utf-8')
          old = r'''conn.execute('UPDATE order_items SET customer_decision=\'rejected\' WHERE item_id=%s', (iid,))'''
          new = '''conn.execute("UPDATE order_items SET customer_decision='rejected' WHERE item_id=%s", (iid,))'''
          if old not in text:
              raise SystemExit('broken quoting anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('WORKFLOW_REPAIRED')
      - name: Remove repair helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-item-state-workflow.yml .github/workflows/fix-item-state-workflow2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/item-state-fix.yml .github/workflows/fix-item-state-workflow.yml .github/workflows/fix-item-state-workflow2.yml
          git commit -m 'Repair item-state workflow quoting'
          git push
