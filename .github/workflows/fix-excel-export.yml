name: Obsolete Excel export patch (disabled)

on:
  workflow_dispatch:

# This workflow is intentionally disabled.
# The Excel export endpoint is registered by postrollback_export.py
# from gunicorn.conf.py and must not be injected into app.py by CI.
permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled workflow
        run: |
          echo "This workflow is retired. Excel export is maintained in postrollback_export.py."
          echo "No source-code patching or push is performed by CI."