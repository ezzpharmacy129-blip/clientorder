name: P0.2 persist verified repair

on:
  push:
    branches: [p0-2-data-safe-undo]

permissions:
  contents: write

jobs:
  persist:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified P0.2 cloud_db and cleanup dependency
        run: |
          set -euo pipefail
          git show 8eefba4333d7f7962d93b8765e1a542aecf36f9f:cloud_db.py > cloud_db.py
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_db.py')
          s=p.read_text(encoding='utf-8')
          old="TRUNCATE activity_log, undo_history, item_images, order_items, orders"
          new="TRUNCATE activity_log, undo_item_images, undo_history, item_images, order_items, orders"
          if s.count(old)!=2: raise SystemExit(f'FAIL CLOSED: expected 2 cleanup statements, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Persist repaired file and remove temporary workflow
        run: |
          git rm .github/workflows/p0_2_commit_final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_db.py
          git commit -m 'fix: finalize P0.2 data-safe undo [skip ci]'
          git push origin HEAD:p0-2-data-safe-undo
