name: One-time dashboard source-of-truth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-dashboard-source:
    if: ${{ !contains(github.event.head_commit.message, 'unify dashboard source of truth') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply dashboard consistency fix
        shell: python
        run: |
          from pathlib import Path

          app = Path("app.py")
          s = app.read_text(encoding="utf-8")

          start = s.index("def _action_center_item(order, today):")
          end = s.index("\ndef _dashboard_order_payload(order):", start)
          new_fn = '''def _action_center_item(order, today):
              status = str(order.get("Status") or "").strip()
              contact = str(order.get("Contact_Status") or "").strip()
              next_followup = str(order.get("Next_Followup_Date") or "").strip()

              if status in CLOSED_STATUSES:
                  return None

              # Single operational definition of a follow-up candidate.
              # This must stay aligned with dashboard_action_summary().
              followup_candidate = (
                  (status in (STATUS_AVAILABLE, STATUS_PARTIAL, STATUS_UNAVAILABLE)
                   and contact in ("", CONTACT_NOT_CONTACTED))
                  or contact == CONTACT_AWAITING
                  or status in (STATUS_CONTACTED, STATUS_NOT_PICKED)
              )

              if followup_candidate and next_followup and next_followup < today:
                  hint = "موعد المتابعة تجاوز اليوم"
                  try:
                      due = date.fromisoformat(next_followup)
                      now = date.fromisoformat(today)
                      hint = f"متأخر منذ {max(1, (now - due).days)} يوم"
                  except ValueError:
                      pass
                  return {"action_key":"overdue","priority":0,"next_action":"متابعة عاجلة","action_hint":hint}

              if followup_candidate and next_followup == today:
                  return {"action_key":"today","priority":1,"next_action":"متابعة العميل","action_hint":"موعد المتابعة اليوم"}

              if contact == CONTACT_AWAITING:
                  return {"action_key":"awaiting_reply","priority":2,"next_action":"انتظار رد العميل","action_hint":"الرسالة أُرسلت وننتظر رد العميل"}

              pending_items = [
                  i for i in (order.get("Items") or [])
                  if str(i.get("Availability_Status") or "").strip() == "بانتظار التوفر"
                  and str(i.get("Customer_Decision") or "").strip().lower() != "rejected"
              ]
              if status == STATUS_PENDING or pending_items:
                  return {"action_key":"needs_supply","priority":3,"next_action":"متابعة التوفير","action_hint":f"يوجد {len(pending_items) if pending_items else 1} منتج بانتظار التوفر"}

              return None
          '''
          s = s[:start] + new_fn + s[end:]

          old = '''    action_center = _build_action_center_payload(orders, today)
    action_summary = db.dashboard_action_summary(today)
    action_center["summary"] = {**action_center.get("summary", {}), **action_summary}
    followups = _active_followups_payload(orders, today)'''
          replacement = '''    action_center = _build_action_center_payload(orders, today)
    # Action Center is the source of truth for actionable categories.
    action_summary = action_center["summary"]
    stats["overdue"] = action_summary["overdue"]
    stats["today_followup"] = action_summary["today"]
    followups = _active_followups_payload(orders, today)'''
          if old not in s:
              raise SystemExit("Expected action-center summary block not found")
          s = s.replace(old, replacement, 1)

          old_overdue = '''        "overdue": [payload for order, payload in dashboard_entries if (
            (order.get("Contact_Status") == CONTACT_AWAITING or order["Status"] in (STATUS_CONTACTED, STATUS_NOT_PICKED))
            and str(order.get("Next_Followup_Date") or "")
            and str(order.get("Next_Followup_Date")) < today
        )],'''
          new_overdue = '''        "overdue": [payload for order, payload in dashboard_entries if (_action_center_item(order, today) or {}).get("action_key") == "overdue"],'''
          if old_overdue not in s:
              raise SystemExit("Expected dashboard overdue filter not found")
          s = s.replace(old_overdue, new_overdue, 1)

          old_today = '''        "today_followup": [payload for order, payload in dashboard_entries if (
            ((order["Status"] in (STATUS_AVAILABLE, STATUS_PARTIAL, STATUS_UNAVAILABLE) and order.get("Contact_Status") in ("", CONTACT_NOT_CONTACTED))
             or order.get("Contact_Status") == CONTACT_AWAITING
             or order["Status"] in (STATUS_CONTACTED, STATUS_NOT_PICKED))
            and str(order.get("Next_Followup_Date") or "") == today
        )],'''
          new_today = '''        "today_followup": [payload for order, payload in dashboard_entries if (_action_center_item(order, today) or {}).get("action_key") == "today"],'''
          if old_today not in s:
              raise SystemExit("Expected dashboard today filter not found")
          s = s.replace(old_today, new_today, 1)

          app.write_text(s, encoding="utf-8")

          cloud = Path("cloud_db.py")
          c = cloud.read_text(encoding="utf-8")
          old_sql = '''                        WHERE (
                            o.contact_status='بانتظار رد العميل'
                            OR o.status IN ('تم التواصل - بانتظار الاستلام','لم يستلم')
                        )
                        AND o.next_followup_date <> ''
                        AND o.next_followup_date < %s'''
          new_sql = '''                        WHERE (
                            (o.status IN ('متوفر - يحتاج اتصال','متوفر جزئيًا - يحتاج اتصال','غير متوفر - يحتاج اتصال')
                             AND COALESCE(o.contact_status,'') IN ('','لم يتم التواصل'))
                            OR o.contact_status='بانتظار رد العميل'
                            OR o.status IN ('تم التواصل - بانتظار الاستلام','لم يستلم')
                        )
                        AND o.next_followup_date <> ''
                        AND o.next_followup_date < %s'''
          if old_sql not in c:
              raise SystemExit("Expected dashboard_summary overdue SQL not found")
          c = c.replace(old_sql, new_sql, 1)
          cloud.write_text(c, encoding="utf-8")

          db = Path("db.py")
          d = db.read_text(encoding="utf-8")
          old_py = '''            "overdue":sum(1 for o in orders if (o.get("Contact_Status")=="بانتظار رد العميل" or o.get("Status") in ("تم التواصل - بانتظار الاستلام","لم يستلم")) and str(o.get("Next_Followup_Date") or "") and str(o.get("Next_Followup_Date"))<today),'''
          new_py = '''            "overdue":sum(1 for o in orders if ((o.get("Status") in ("متوفر - يحتاج اتصال","متوفر جزئيًا - يحتاج اتصال","غير متوفر - يحتاج اتصال") and o.get("Contact_Status","") in ("","لم يتم التواصل")) or o.get("Contact_Status")=="بانتظار رد العميل" or o.get("Status") in ("تم التواصل - بانتظار الاستلام","لم يستلم")) and str(o.get("Next_Followup_Date") or "") and str(o.get("Next_Followup_Date"))<today),'''
          if old_py not in d:
              raise SystemExit("Expected local dashboard_summary overdue logic not found")
          d = d.replace(old_py, new_py, 1)
          db.write_text(d, encoding="utf-8")

          test = Path("tests/test_dashboard_source_of_truth.py")
          test.write_text('''import unittest\nfrom pathlib import Path\n\nclass DashboardSourceOfTruthTests(unittest.TestCase):\n    def test_app_uses_action_center_for_overdue_filter(self):\n        s = Path("app.py").read_text(encoding="utf-8")\n        self.assertIn('action_center = _build_action_center_payload(orders, today)', s)\n        self.assertIn('stats["overdue"] = action_summary["overdue"]', s)\n        self.assertIn('get("action_key") == "overdue"', s)\n\n    def test_overdue_definition_includes_available_contact_states(self):\n        s = Path("app.py").read_text(encoding="utf-8")\n        self.assertIn('status in (STATUS_AVAILABLE, STATUS_PARTIAL, STATUS_UNAVAILABLE)', s)\n        self.assertIn('followup_candidate', s)\n\n    def test_sql_overdue_definition_matches_available_contact_states(self):\n        s = Path("cloud_db.py").read_text(encoding="utf-8")\n        self.assertIn("o.status IN ('متوفر - يحتاج اتصال','متوفر جزئيًا - يحتاج اتصال','غير متوفر - يحتاج اتصال')", s)\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          # P2.3 originally asserted that the route consumed a second,
          # independent action-summary source. That is intentionally removed:
          # the Action Center payload is now the source of truth.
          p23 = Path("tests/test_p2_3_dashboard_query_aggregation.py")
          p23s = p23.read_text(encoding="utf-8")
          p23s = p23s.replace(
              'self.assertIn("action_summary = db.dashboard_action_summary(today)",s)\n'
              '        self.assertIn(\'action_center["summary"] = {**action_center.get("summary", {}), **action_summary}\',s)',
              'self.assertIn(\'action_summary = action_center["summary"]\',s)\n'
              '        self.assertIn(\'stats["overdue"] = action_summary["overdue"]\',s)'
          )
          p23.write_text(p23s, encoding="utf-8")

      - name: Validate
        run: |
          python -m py_compile app.py cloud_db.py db.py
          python -m unittest -v tests/test_dashboard_source_of_truth.py
          python -m unittest -v tests/test_p2_1_dashboard_aggregation_final.py tests/test_p2_3_dashboard_query_aggregation.py
          git diff --check

      - name: Commit fix and retire this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py cloud_db.py db.py tests/test_dashboard_source_of_truth.py tests/test_p2_3_dashboard_query_aggregation.py .github/workflows/one-time-dashboard-source-fix.yml
          git rm .github/workflows/one-time-dashboard-source-fix.yml
          git commit -m "fix: unify dashboard source of truth"
          git push
