name: Repair item-state patch workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and trigger robust patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/item-state-fix.yml')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace(
              "conn.execute('UPDATE order_items SET customer_decision=\\'rejected\\' WHERE item_id=%s', (iid,))",
              "conn.execute(\"UPDATE order_items SET customer_decision='rejected' WHERE item_id=%s\", (iid,))",
          )
          if s2 == s:
              raise SystemExit('Expected broken SQL quoting was not found')
          p.write_text(s2, encoding='utf-8')
          print('WORKFLOW_SYNTAX_REPAIRED')
          PY
          rm -f .github/workflows/fix-item-state-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/item-state-fix.yml .github/workflows/fix-item-state-workflow.yml
          git commit -m "Repair item-state workflow quoting"
          git push
