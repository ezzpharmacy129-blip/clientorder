name: Apply undo status source fix once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix undo status source [applied]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact source change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloud_db.py')
          s = p.read_text(encoding='utf-8')
          old = "current['status']"
          new = "current['Status']"
          if old not in s:
              raise SystemExit('Expected current status access not found; refusing unrelated changes.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source fix and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_db.py
          git rm .github/workflows/fix-undo-status.yml
          git commit -m 'Fix undo status source [applied]'
          git push
