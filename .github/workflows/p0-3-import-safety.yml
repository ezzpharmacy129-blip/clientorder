name: P0.3 Import Safety

on:
  push:
    branches: [p0-3-import-safety]

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ezz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ezz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ezz_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply P0.3 implementation and tests
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          p = root / 'cloud_db.py'
          text = p.read_text(encoding='utf-8')

          if 'def _validate_import_payload(self, orders, items, logs, undos, settings, images=None):' not in text:
              pattern = r"    def _replace_from_xlsx\(self, xlsx_bytes, images=None\):\n.*?(?=    def import_legacy_data\(self, source_path\):)"
              match = re.search(pattern, text, flags=re.S)
              if not match:
                  raise SystemExit('P0.3 replacement boundary not found')

              new_block = '''    def _validate_import_payload(self, orders, items, logs, undos, settings, images=None):\n        order_ids = set()\n        for row in orders:\n            oid = str(row.get('Order_ID') or '').strip()\n            if not oid:\n                raise ValueError('بيانات الاستيراد تحتوي طلبًا بدون Order_ID')\n            if oid in order_ids:\n                raise ValueError(f'تكرار Order_ID في ملف الاستيراد: {oid}')\n            order_ids.add(oid)\n            customer = str(row.get('Customer_Name') or '').strip()\n            phone = str(row.get('Phone') or '').strip()\n            if not customer:\n                raise ValueError(f'الطلب {oid} بدون اسم عميل')\n            if not phone:\n                raise ValueError(f'الطلب {oid} بدون رقم هاتف')\n            status = str(row.get('Status') or '').strip() or STATUS_PENDING\n            contact = str(row.get('Contact_Status') or '').strip() or (\n                CONTACT_AWAITING if status in (STATUS_CONTACTED, STATUS_NOT_PICKED) else CONTACT_NOT_CONTACTED\n            )\n            if status not in ALL_STATUSES:\n                raise ValueError(f'حالة الطلب غير صحيحة للطلب {oid}: {status}')\n            if contact not in ALL_CONTACT_STATUSES:\n                raise ValueError(f'حالة التواصل غير صحيحة للطلب {oid}: {contact}')\n            raw_quantity = row.get('Quantity')\n            if raw_quantity not in ('', None):\n                try:\n                    quantity = int(raw_quantity)\n                except (TypeError, ValueError):\n                    raise ValueError(f'كمية الطلب غير صحيحة للطلب {oid}')\n                if quantity < 0:\n                    raise ValueError(f'كمية الطلب لا يمكن أن تكون سالبة للطلب {oid}')\n\n        item_ids = set()\n        item_by_id = {}\n        referenced_images = set()\n        valid_item_statuses = {'بانتظار التوفر', 'متوفر', 'غير متوفر'}\n        for row in items:\n            iid = str(row.get('Item_ID') or '').strip()\n            oid = str(row.get('Order_ID') or '').strip()\n            if not iid:\n                raise ValueError('بيانات الاستيراد تحتوي عنصرًا بدون Item_ID')\n            if iid in item_ids:\n                raise ValueError(f'تكرار Item_ID في ملف الاستيراد: {iid}')\n            if not oid or oid not in order_ids:\n                raise ValueError(f'العنصر {iid} يشير إلى Order_ID غير موجود: {oid}')\n            product = str(row.get('Product_Name') or '').strip()\n            if not product:\n                raise ValueError(f'العنصر {iid} بدون اسم منتج')\n            try:\n                quantity = int(row.get('Quantity'))\n            except (TypeError, ValueError):\n                raise ValueError(f'كمية العنصر غير صحيحة: {iid}')\n            if quantity <= 0:\n                raise ValueError(f'كمية العنصر يجب أن تكون أكبر من صفر: {iid}')\n            availability = str(row.get('Availability_Status') or '').strip() or 'بانتظار التوفر'\n            if availability not in valid_item_statuses:\n                raise ValueError(f'حالة توفر غير صحيحة للعنصر {iid}: {availability}')\n            image_path = str(row.get('Image_Path') or '').replace('\\\\', '/').lstrip('/')\n            if image_path:\n                referenced_images.add(image_path)\n            item_ids.add(iid)\n            item_by_id[iid] = (oid, image_path)\n\n        log_ids = set()\n        for row in logs:\n            lid = str(row.get('Log_ID') or '').strip()\n            oid = str(row.get('Order_ID') or '').strip()\n            if not lid:\n                raise ValueError('سجل Activity_Log بدون Log_ID')\n            if lid in log_ids:\n                raise ValueError(f'تكرار Log_ID في ملف الاستيراد: {lid}')\n            if oid not in order_ids:\n                raise ValueError(f'سجل Activity_Log يشير إلى طلب غير موجود: {oid}')\n            log_ids.add(lid)\n\n        undo_ids = set()\n        for row in undos:\n            uid = str(row.get('Undo_ID') or '').strip()\n            oid = str(row.get('Order_ID') or '').strip()\n            if not uid:\n                raise ValueError('سجل Undo_History بدون Undo_ID')\n            if uid in undo_ids:\n                raise ValueError(f'تكرار Undo_ID في ملف الاستيراد: {uid}')\n            if oid not in order_ids:\n                raise ValueError(f'سجل Undo_History يشير إلى طلب غير موجود: {oid}')\n            raw_snapshot = str(row.get('Snapshot_JSON') or '').strip()\n            try:\n                snapshot = json.loads(raw_snapshot)\n            except (TypeError, ValueError, json.JSONDecodeError):\n                raise ValueError(f'Snapshot_JSON غير صالح لسجل Undo: {uid}')\n            if not isinstance(snapshot, dict) or not isinstance(snapshot.get('order'), dict) or not isinstance(snapshot.get('items'), list):\n                raise ValueError(f'Snapshot_JSON غير مكتمل لسجل Undo: {uid}')\n            snap_oid = str(snapshot['order'].get('Order_ID') or snapshot['order'].get('order_id') or '').strip()\n            if snap_oid and snap_oid != oid:\n                raise ValueError(f'Snapshot_JSON لا يطابق Order_ID لسجل Undo: {uid}')\n            undo_ids.add(uid)\n\n        setting_keys = set()\n        for row in settings:\n            key = str(row.get('Key') or '').strip()\n            if not key:\n                continue\n            if key in setting_keys:\n                raise ValueError(f'تكرار مفتاح Settings في ملف الاستيراد: {key}')\n            setting_keys.add(key)\n\n        if images is None:\n            if referenced_images:\n                raise ValueError('ملف Excel يحتوي Image_Path بدون ملف صور مرفق')\n            return\n\n        normalized_images = {}\n        for raw_path, data in images.items():\n            path = str(raw_path or '').replace('\\\\', '/').lstrip('/')\n            if not path or path in normalized_images:\n                raise ValueError('مسار صورة مكرر أو فارغ في ملف الاستيراد')\n            if not isinstance(data, (bytes, bytearray)) or not data:\n                raise ValueError(f'ملف الصورة فارغ: {path}')\n            if len(data) > MAX_IMAGE_SIZE:\n                raise ValueError(f'حجم الصورة أكبر من 10 ميجابايت: {path}')\n            parts = path.split('/')\n            if len(parts) != 2 or not parts[0] or not parts[1] or parts[0] not in order_ids:\n                raise ValueError(f'مسار الصورة غير مرتبط بطلب صالح: {path}')\n            filename = os.path.basename(path)\n            stem = os.path.splitext(filename)[0]\n            iid = stem.split('_', 1)[0]\n            if iid not in item_by_id or item_by_id[iid][0] != parts[0]:\n                raise ValueError(f'الصورة لا ترتبط بعنصر صالح: {path}')\n            normalized_images[path] = data\n\n        image_paths = set(normalized_images)\n        if image_paths != referenced_images:\n            missing = sorted(referenced_images - image_paths)\n            extra = sorted(image_paths - referenced_images)\n            details = []\n            if missing:\n                details.append('صور مفقودة: ' + ', '.join(missing))\n            if extra:\n                details.append('صور غير مرتبطة: ' + ', '.join(extra))\n            raise ValueError('حزمة الصور غير متطابقة مع بيانات Order_Items: ' + ' | '.join(details))\n\n    def _replace_from_xlsx(self, xlsx_bytes, images=None):\n        wb = load_workbook(io.BytesIO(xlsx_bytes), read_only=True, data_only=False)\n        if 'Orders' not in wb.sheetnames:\n            wb.close()\n            raise ValueError('ملف البيانات لا يحتوي ورقة Orders المطلوبة')\n        orders = self._read_sheet_dicts(wb['Orders'])\n        required = {'Order_ID', 'Customer_Name', 'Phone'}\n        if not orders or not required.issubset(set(orders[0].keys())):\n            wb.close()\n            raise ValueError('ملف البيانات لا يبدو كملف طلبات صالح')\n        items = self._read_sheet_dicts(wb['Order_Items']) if 'Order_Items' in wb.sheetnames else []\n        logs = self._read_sheet_dicts(wb['Activity_Log']) if 'Activity_Log' in wb.sheetnames else []\n        undos = self._read_sheet_dicts(wb['Undo_History']) if 'Undo_History' in wb.sheetnames else []\n        settings = self._read_sheet_dicts(wb['Settings']) if 'Settings' in wb.sheetnames else []\n        wb.close()\n\n        self._validate_import_payload(orders, items, logs, undos, settings, images)\n\n        with self._connect() as conn:\n            conn.execute('TRUNCATE activity_log, undo_item_images, undo_history, item_images, order_items, orders')\n            for r in orders:\n                oid = str(r.get('Order_ID') or '').strip()\n                status = r.get('Status') or STATUS_PENDING\n                contact = r.get('Contact_Status') or (CONTACT_AWAITING if status in (STATUS_CONTACTED, STATUS_NOT_PICKED) else CONTACT_NOT_CONTACTED)\n                conn.execute('INSERT INTO orders(order_id,customer_name,phone,product_name,quantity,order_date,available_date,status,contact_status,last_contact_date,next_followup_date,pickup_date,notes,created_at,updated_at) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',\n                             (oid,str(r.get('Customer_Name') or ''),str(r.get('Phone') or ''),str(r.get('Product_Name') or ''),int(r.get('Quantity') or 0),str(r.get('Order_Date') or ''),str(r.get('Available_Date') or ''),status,contact,str(r.get('Last_Contact_Date') or ''),str(r.get('Next_Followup_Date') or ''),str(r.get('Pickup_Date') or ''),str(r.get('Notes') or ''),str(r.get('Created_At') or now_str()),str(r.get('Updated_At') or now_str())))\n            for r in items:\n                iid = str(r.get('Item_ID') or '').strip()\n                oid = str(r.get('Order_ID') or '').strip()\n                conn.execute('INSERT INTO order_items(item_id,order_id,product_name,quantity,image_path,availability_status,available_price,discounted_price,unavailable_reason,availability_note,price_confirmation_required,available_at,created_at,customer_decision) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',\n                             (iid,oid,str(r.get('Product_Name') or ''),int(r.get('Quantity') or 1),str(r.get('Image_Path') or ''),str(r.get('Availability_Status') or 'بانتظار التوفر'),str(r.get('Available_Price') or ''),str(r.get('Discounted_Price') or ''),str(r.get('Unavailable_Reason') or ''),str(r.get('Availability_Note') or ''),str(r.get('Price_Confirmation_Required') or ''),str(r.get('Available_At') or ''),str(r.get('Created_At') or now_str()),str(r.get('Customer_Decision') or '')))
            for r in logs:\n                conn.execute('INSERT INTO activity_log(log_id,order_id,action,old_status,new_status,note,created_at,user_name) VALUES (%s,%s,%s,%s,%s,%s,%s,%s)',\n                             (str(r.get('Log_ID') or uuid.uuid4().hex),str(r.get('Order_ID') or ''),str(r.get('Action') or ''),str(r.get('Old_Status') or ''),str(r.get('New_Status') or ''),str(r.get('Note') or ''),str(r.get('Created_At') or now_str()),str(r.get('User') or 'موظف')))\n            for r in undos:\n                conn.execute('INSERT INTO undo_history(undo_id,order_id,action,snapshot_json,created_at,undone_at,user_name) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                             (str(r.get('Undo_ID') or uuid.uuid4().hex),str(r.get('Order_ID') or ''),str(r.get('Action') or ''),str(r.get('Snapshot_JSON') or '{}'),str(r.get('Created_At') or now_str()),str(r.get('Undone_At') or ''),str(r.get('User') or 'موظف')))\n            for r in settings:\n                k = str(r.get('Key') or '').strip()\n                if k:\n                    conn.execute('INSERT INTO settings(key,value) VALUES (%s,%s) ON CONFLICT(key) DO UPDATE SET value=EXCLUDED.value',(k,str(r.get('Value') or '')))\n            if images:\n                for path, data in images.items():\n                    path = path.replace('\\\\','/').lstrip('/')\n                    oid, filename = path.split('/', 1)\n                    iid = os.path.splitext(filename)[0].split('_', 1)[0]\n                    ext = os.path.splitext(filename)[1].lower()\n                    ctype = {'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','webp':'image/webp'}.get(ext.lstrip('.'),'application/octet-stream')\n                    conn.execute('INSERT INTO item_images(image_path,order_id,item_id,filename,content_type,data,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                                 (path,oid,iid,filename,ctype,psycopg.Binary(data),now_str()))\n\n'''
              text = text[:match.start()] + new_block + text[match.end():]

          old = "backup=self.create_manual_backup(reason='auto') if self.list_backups() else None"
          if old in text:
              text = text.replace(old, "backup=self.create_manual_backup(reason='auto')", 1)

          p.write_text(text, encoding='utf-8')

          test_path = root / 'tests/test_p0_3_import_safety.py'
          test_path.write_text(r'''import io
import json
import os
import tempfile
import unittest
from unittest.mock import Mock

import psycopg
from openpyxl import Workbook

from cloud_db import CloudDB
from db import STATUS_PENDING, CONTACT_NOT_CONTACTED

psycopg.Binary = lambda value: value


def workbook_bytes(orders, items=None, logs=None, undos=None, settings=None):
    wb = Workbook()
    ws = wb.active
    ws.title = 'Orders'
    ws.append(['Order_ID', 'Customer_Name', 'Phone', 'Product_Name', 'Quantity', 'Order_Date', 'Available_Date', 'Status', 'Contact_Status', 'Last_Contact_Date', 'Next_Followup_Date', 'Pickup_Date', 'Notes', 'Created_At', 'Updated_At'])
    for r in orders:
        ws.append([r.get(h, '') for h in ws[1]])
    for name, headers, rows in [
        ('Order_Items', ['Item_ID','Order_ID','Product_Name','Quantity','Image_Path','Availability_Status','Available_Price','Discounted_Price','Unavailable_Reason','Availability_Note','Price_Confirmation_Required','Available_At','Created_At','Customer_Decision'], items or []),
        ('Activity_Log', ['Log_ID','Order_ID','Action','Old_Status','New_Status','Note','Created_At','User'], logs or []),
        ('Undo_History', ['Undo_ID','Order_ID','Action','Snapshot_JSON','Created_At','Undone_At','User'], undos or []),
        ('Settings', ['Key','Value'], settings or []),
    ]:
        sh = wb.create_sheet(name)
        sh.append(headers)
        for r in rows:
            sh.append([r.get(h, '') for h in headers])
    bio = io.BytesIO()
    wb.save(bio)
    wb.close()
    return bio.getvalue()


class ValidationTests(unittest.TestCase):
    def setUp(self):
        self.db = CloudDB.__new__(CloudDB)
        self.order = {'Order_ID':'ORD-1','Customer_Name':'عميل','Phone':'0500000000','Status':STATUS_PENDING,'Contact_Status':CONTACT_NOT_CONTACTED}
        self.item = {'Item_ID':'ITEM-1','Order_ID':'ORD-1','Product_Name':'دواء','Quantity':1,'Image_Path':'','Availability_Status':'بانتظار التوفر'}

    def payload(self, orders=None, items=None, logs=None, undos=None, settings=None, images=None):
        return orders or [self.order.copy()], items or [self.item.copy()], logs or [], undos or [], settings or [], images

    def assert_rejected(self, **kwargs):
        with self.assertRaises(ValueError):
            self.db._validate_import_payload(*self.payload(**kwargs))

    def test_duplicate_order_rejected(self):
        a = self.order.copy(); b = self.order.copy(); b['Customer_Name'] = 'آخر'
        self.assert_rejected(orders=[a,b])

    def test_orphan_item_rejected(self):
        i = self.item.copy(); i['Order_ID'] = 'ORD-404'
        self.assert_rejected(items=[i])

    def test_duplicate_item_rejected(self):
        i1 = self.item.copy(); i2 = self.item.copy(); i2['Product_Name'] = 'منتج آخر'
        self.assert_rejected(items=[i1,i2])

    def test_dangling_image_rejected(self):
        i = self.item.copy(); i['Image_Path'] = 'ORD-1/ITEM-404.png'
        self.assert_rejected(items=[i], images={'ORD-1/ITEM-404.png': b'x'})

    def test_unreferenced_image_rejected(self):
        self.assert_rejected(images={'ORD-1/ITEM-1.png': b'x'})

    def test_malformed_undo_rejected(self):
        undo = {'Undo_ID':'U1','Order_ID':'ORD-1','Snapshot_JSON':'not-json'}
        self.assert_rejected(undos=[undo])

    def test_invalid_status_rejected(self):
        o = self.order.copy(); o['Status'] = 'حالة غير موجودة'
        self.assert_rejected(orders=[o])

    def test_prevalidation_happens_before_database_mutation(self):
        a = self.order.copy(); b = self.order.copy(); b['Customer_Name'] = 'آخر'
        self.db._connect = Mock(side_effect=AssertionError('database opened before validation'))
        with self.assertRaises(ValueError):
            self.db._replace_from_xlsx(workbook_bytes([a,b]))
        self.db._connect.assert_not_called()


class ImportSafetyTests(unittest.TestCase):
    def test_backup_is_unconditional_and_precedes_replace(self):
        db = CloudDB.__new__(CloudDB)
        events = []
        db.create_manual_backup = Mock(side_effect=lambda reason='auto': events.append(('backup', reason)) or 'backup_auto.zip')
        db.list_backups = Mock(side_effect=AssertionError('list_backups must not control safety backup'))
        db._replace_from_xlsx = Mock(side_effect=lambda *_args: events.append(('replace', None)))
        db.get_all_orders = Mock(return_value=[])
        payload = workbook_bytes([{'Order_ID':'ORD-1','Customer_Name':'عميل','Phone':'0500000000','Status':STATUS_PENDING,'Contact_Status':CONTACT_NOT_CONTACTED}])
        with tempfile.NamedTemporaryFile(suffix='.xlsx', delete=False) as f:
            f.write(payload); path = f.name
        try:
            result = db.import_legacy_data(path)
        finally:
            os.unlink(path)
        self.assertEqual(events, [('backup','auto'),('replace',None)])
        self.assertEqual(result['backup'], 'backup_auto.zip')
        db.list_backups.assert_not_called()

    def test_replace_failure_happens_after_backup(self):
        db = CloudDB.__new__(CloudDB)
        events = []
        db.create_manual_backup = Mock(side_effect=lambda reason='auto': events.append(('backup', reason)) or 'backup_auto.zip')
        db._replace_from_xlsx = Mock(side_effect=lambda *_args: events.append(('replace', None)) or (_ for _ in ()).throw(RuntimeError('replace failed')))
        payload = workbook_bytes([{'Order_ID':'ORD-1','Customer_Name':'عميل','Phone':'0500000000','Status':STATUS_PENDING,'Contact_Status':CONTACT_NOT_CONTACTED}])
        with tempfile.NamedTemporaryFile(suffix='.xlsx', delete=False) as f:
            f.write(payload); path = f.name
        try:
            with self.assertRaises(RuntimeError):
                db.import_legacy_data(path)
        finally:
            os.unlink(path)
        self.assertEqual(events, [('backup','auto'),('replace',None)])


class PostgresIntegrationTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls):
        cls.url = os.environ.get('DATABASE_URL')
        if not cls.url:
            raise unittest.SkipTest('DATABASE_URL not set')
        cls.db = CloudDB()

    def setUp(self):
        with self.db._connect() as conn:
            conn.execute('TRUNCATE backups, activity_log, undo_item_images, undo_history, item_images, order_items, orders')
            conn.execute("INSERT INTO orders(order_id,customer_name,phone,product_name,quantity,status,contact_status,created_at,updated_at) VALUES ('OLD-1','قديم','0500000001','قديم',1,%s,%s,'T','T')", (STATUS_PENDING, CONTACT_NOT_CONTACTED))
            conn.execute("INSERT INTO order_items(item_id,order_id,product_name,quantity,availability_status,created_at) VALUES ('OLD-ITEM','OLD-1','قديم',1,'بانتظار التوفر','T')")

    def test_valid_import_creates_backup_even_when_none_exists(self):
        payload = workbook_bytes(
            [{'Order_ID':'NEW-1','Customer_Name':'جديد','Phone':'0500000002','Product_Name':'جديد','Quantity':1,'Status':STATUS_PENDING,'Contact_Status':CONTACT_NOT_CONTACTED}],
            [{'Item_ID':'NEW-ITEM','Order_ID':'NEW-1','Product_Name':'منتج جديد','Quantity':1,'Availability_Status':'بانتظار التوفر'}],
        )
        with tempfile.NamedTemporaryFile(suffix='.xlsx', delete=False) as f:
            f.write(payload); path = f.name
        try:
            result = self.db.import_legacy_data(path)
        finally:
            os.unlink(path)
        with self.db._connect() as conn:
            old = conn.execute("SELECT COUNT(*) AS c FROM orders WHERE order_id='OLD-1'").fetchone()['c']
            new = conn.execute("SELECT COUNT(*) AS c FROM orders WHERE order_id='NEW-1'").fetchone()['c']
            backups = conn.execute('SELECT COUNT(*) AS c FROM backups').fetchone()['c']
        self.assertEqual(old, 0)
        self.assertEqual(new, 1)
        self.assertEqual(backups, 1)
        self.assertEqual(result['backup'].startswith('backup_auto_'), True)

    def test_invalid_import_does_not_touch_current_data_or_create_backup(self):
        a = {'Order_ID':'NEW-1','Customer_Name':'جديد','Phone':'0500000002','Status':STATUS_PENDING,'Contact_Status':CONTACT_NOT_CONTACTED}
        b = {'Order_ID':'NEW-1','Customer_Name':'مكرر','Phone':'0500000003','Status':STATUS_PENDING,'Contact_Status':CONTACT_NOT_CONTACTED}
        payload = workbook_bytes([a,b])
        with tempfile.NamedTemporaryFile(suffix='.xlsx', delete=False) as f:
            f.write(payload); path = f.name
        try:
            with self.assertRaises(ValueError):
                self.db.import_legacy_data(path)
        finally:
            os.unlink(path)
        with self.db._connect() as conn:
            old = conn.execute("SELECT COUNT(*) AS c FROM orders WHERE order_id='OLD-1'").fetchone()['c']
            backups = conn.execute('SELECT COUNT(*) AS c FROM backups').fetchone()['c']
        self.assertEqual(old, 1)
        self.assertEqual(backups, 0)


if __name__ == '__main__':
    unittest.main()
''', encoding='utf-8')

