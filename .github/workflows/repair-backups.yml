name: Repair backups frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[item-state-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply robust item state fix
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('tools/apply_item_state_fix.py')
          if not p.exists():
              raise SystemExit('item state fix script missing')
          subprocess.run(['python', str(p)], check=True)
      - name: Commit source changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/item-state-fix.yml .github/workflows/fix-item-state-workflow.yml .github/workflows/fix-item-state-workflow2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py db.py cloud_db.py static/app.js tools/apply_item_state_fix.py .github/workflows/item-state-fix.yml .github/workflows/fix-item-state-workflow.yml .github/workflows/fix-item-state-workflow2.yml
          git commit -m 'Fix item-level order state handling [item-state-fix]'
          git push
