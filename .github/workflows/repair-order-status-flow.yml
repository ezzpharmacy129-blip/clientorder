name: Repair order status flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'restore order status flow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Repair availability action and customer rejection flow
        shell: python
        run: |
          from pathlib import Path

          app = Path('static/app.js')
          s = app.read_text(encoding='utf-8')
          old_ui = "((o.Items||[]).some(i=>i.Availability_Status==='بانتظار التوفر'))||['بانتظار التوفر','متوفر - يحتاج اتصال','متوفر جزئيًا - يحتاج اتصال'].includes(o.Status)"
          new_ui = "((o.Items||[]).some(i=>i.Availability_Status==='بانتظار التوفر'))||['بانتظار التوفر','متوفر - يحتاج اتصال','متوفر جزئيًا - يحتاج اتصال','غير متوفر - يحتاج اتصال'].includes(o.Status)"
          if old_ui in s:
              if s.count(old_ui) != 1:
                  raise SystemExit(f'Expected one availability-action anchor, found {s.count(old_ui)}')
              s = s.replace(old_ui, new_ui, 1)
              print('UI_AVAILABILITY_ACTION_FIXED')
          elif new_ui in s:
              print('UI_AVAILABILITY_ACTION_ALREADY_FIXED')
          else:
              raise SystemExit('Availability-action anchor not found')
          app.write_text(s, encoding='utf-8')

          p = Path('cloud_db.py')
          s = p.read_text(encoding='utf-8')
          old_db = '''            elif contact_status == CONTACT_REJECTED:\n                available_ids={str(i['Item_ID']) for i in items if i.get('Availability_Status')=='متوفر'}\n                if not rejected_item_ids: rejected_item_ids=available_ids\n                invalid=rejected_item_ids-available_ids\n                if invalid: return {'error':'يمكن تسجيل رفض العميل فقط للمنتجات المتوفرة حاليًا','code':400}\n                for iid in rejected_item_ids:\n                    conn.execute("UPDATE order_items SET customer_decision='rejected' WHERE item_id=%s AND order_id=%s", (iid,str(order_id)))\n'''
          new_db = '''            elif contact_status == CONTACT_REJECTED:\n                available_ids={str(i['Item_ID']) for i in items if i.get('Availability_Status')=='متوفر'}\n                if not rejected_item_ids:\n                    rejected_item_ids=available_ids\n                    # When the customer rejects because nothing is available, there\n                    # may be no available item to select. In that case the active\n                    # non-pending items are the rejected items for this order.\n                    if not rejected_item_ids:\n                        rejected_item_ids={str(i['Item_ID']) for i in items if i.get('Availability_Status')!='بانتظار التوفر' and not self._item_is_rejected(current,i)}\n                invalid=rejected_item_ids-available_ids\n                if invalid:\n                    unavailable_ids={str(i['Item_ID']) for i in items if i.get('Availability_Status')=='غير متوفر'}\n                    if not invalid.issubset(unavailable_ids):\n                        return {'error':'يمكن تسجيل رفض العميل فقط للمنتجات المتوفرة أو غير المتوفرة حاليًا','code':400}\n                for iid in rejected_item_ids:\n                    conn.execute("UPDATE order_items SET customer_decision='rejected' WHERE item_id=%s AND order_id=%s", (iid,str(order_id)))\n'''
          if old_db in s:
              if s.count(old_db) != 1:
                  raise SystemExit(f'Expected one rejection block, found {s.count(old_db)}')
              s = s.replace(old_db, new_db, 1)
              print('DB_REJECTION_FLOW_FIXED')
          elif new_db in s:
              print('DB_REJECTION_FLOW_ALREADY_FIXED')
          else:
              raise SystemExit('Customer rejection block not found')
          p.write_text(s, encoding='utf-8')

      - name: Verify source after repair
        shell: python
        run: |
          from pathlib import Path
          app = Path('static/app.js').read_text(encoding='utf-8')
          db = Path('cloud_db.py').read_text(encoding='utf-8')
          assert "'غير متوفر - يحتاج اتصال'].includes(o.Status)" in app
          assert "rejected_item_ids={str(i['Item_ID']) for i in items if i.get('Availability_Status')!='بانتظار التوفر'" in db
          print('SOURCE_VERIFICATION_PASS')

      - name: Commit repaired source and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js cloud_db.py .github/workflows/repair-order-status-flow.yml
          git rm .github/workflows/repair-order-status-flow.yml
          git commit -m 'fix: restore order status flow'
          git push
