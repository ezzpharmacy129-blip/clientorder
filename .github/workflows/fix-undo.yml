name: Fix undo SQL safely

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-undo:
    if: "!contains(github.event.head_commit.message, '[undo-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-level undo fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloud_db.py')
          s = p.read_text(encoding='utf-8')
          old = """for key, dbkey in [('Customer_Name','customer_name'),('Phone','phone'),('Product_Name','product_name'),('Quantity','quantity'),('Order_Date','order_date'),('Available_Date','available_date'),('Status','status'),('Contact_Status','contact_status'),('Last_Contact_Date','last_contact_date'),('Next_Followup_Date','next_followup_date'),('Pickup_Date','pickup_date'),('Notes','notes'),('Created_At','created_at'),('Updated_At','updated_at')]:"""
          new = """for key, dbkey in [('Customer_Name','customer_name'),('Phone','phone'),('Product_Name','product_name'),('Quantity','quantity'),('Order_Date','order_date'),('Available_Date','available_date'),('Status','status'),('Contact_Status','contact_status'),('Last_Contact_Date','last_contact_date'),('Next_Followup_Date','next_followup_date'),('Pickup_Date','pickup_date'),('Notes','notes'),('Created_At','created_at')]:"""
          if old not in s:
              raise SystemExit('Expected undo restore mapping was not found; refusing to modify files.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud_db.py
          git commit -m 'Fix undo duplicate updated_at assignment [undo-fix-applied]'
          git rm .github/workflows/fix-undo.yml
          git commit -m 'Remove temporary undo fix workflow [undo-fix-applied]'
          git push
