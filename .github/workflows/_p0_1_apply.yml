name: P0.1 temporary patch runner

on:
  push:
    branches: [p0-1-data-safe-item-update]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'feat: close P0.1 data-safe item updates'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply fail-closed P0.1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cloud_path = Path('cloud_db.py')
          app_path = Path('app.py')
          text = cloud_path.read_text(encoding='utf-8')
          old_sig = "    def update_order(self, order_id, fields, products=None, user='موظف'):\n"
          new_sig = "    def update_order(self, order_id, fields, products=None, user='موظف', deleted_item_ids=None):\n"
          if text.count(old_sig) != 1:
              raise SystemExit('FAIL CLOSED: CloudDB.update_order signature target not found exactly once')
          text = text.replace(old_sig, new_sig, 1)

          old_block = '''            if products is not None:\n                clean_products = []\n                for p in products:\n                    try: qty = int(p.get('quantity', 0))\n                    except (TypeError, ValueError): qty = 0\n                    name = str(p.get('product_name', '')).strip()\n                    if name and qty > 0:\n                        clean_products.append({'product_name': name, 'quantity': qty})\n                if not clean_products:\n                    raise ValueError('يجب إضافة منتج واحد على الأقل')\n                updates['Product_Name'] = '، '.join(f\"{p['product_name']} × {p['quantity']}\" for p in clean_products)\n                updates['Quantity'] = sum(p['quantity'] for p in clean_products)\n                conn.execute('DELETE FROM order_items WHERE order_id=%s', (str(order_id),))\n                ts = now_str()\n                for p in clean_products:\n                    conn.execute('INSERT INTO order_items(item_id,order_id,product_name,quantity,image_path,availability_status,available_price,discounted_price,unavailable_reason,availability_note,price_confirmation_required,available_at,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',\n                                 (self._next_item_id(conn), str(order_id), p['product_name'], p['quantity'], '', 'بانتظار التوفر', '', '', '', '', '', '', ts))\n'''
          if text.count(old_block) != 1:
              raise SystemExit('FAIL CLOSED: destructive order_items replacement block not found exactly once')

          new_block = '''            if products is not None:\n                existing_items = self._fetch_items(conn, order_id)\n                existing_by_id = {str(item['Item_ID']): item for item in existing_items}\n                deleted_ids = {str(x).strip() for x in (deleted_item_ids or []) if str(x).strip()}\n                overlap = deleted_ids.intersection(existing_by_id)\n                unknown_deleted = deleted_ids.difference(existing_by_id)\n                if unknown_deleted:\n                    raise ValueError(f\"لا يمكن حذف منتجات غير موجودة في الطلب: {', '.join(sorted(unknown_deleted))}\")\n\n                resolved = []\n                seen_ids = set()\n                new_count = 0\n                for index, p in enumerate(products, 1):\n                    p = p or {}\n                    name = str(p.get('product_name') or '').strip()\n                    try:\n                        qty = int(p.get('quantity', 0))\n                    except (TypeError, ValueError):\n                        qty = 0\n                    if not name:\n                        raise ValueError(f\"اسم المنتج رقم {index} مطلوب\")\n                    if qty <= 0:\n                        raise ValueError(f\"كمية المنتج رقم {index} يجب أن تكون أكبر من صفر\")\n\n                    item_id = str(p.get('item_id') or p.get('Item_ID') or '').strip()\n                    if item_id:\n                        if item_id not in existing_by_id:\n                            raise ValueError(f\"Item_ID غير موجود في هذا الطلب: {item_id}\")\n                        if item_id in seen_ids:\n                            raise ValueError(f\"تم تكرار Item_ID في المنتجات: {item_id}\")\n                        if item_id in overlap:\n                            raise ValueError(f\"لا يمكن تعديل وحذف نفس المنتج: {item_id}\")\n                        seen_ids.add(item_id)\n                        resolved.append({'item_id': item_id, 'product_name': name, 'quantity': qty, 'is_new': False})\n                    else:\n                        new_count += 1\n                        resolved.append({'item_id': None, 'product_name': name, 'quantity': qty, 'is_new': True})\n\n                final_count = len(existing_items) - len(overlap) + new_count\n                if final_count <= 0:\n                    raise ValueError('لا يمكن حفظ الطلب بدون أي منتج. أضف منتجًا أو ألغِ حذف المنتج.')\n\n                ts = now_str()\n                for item in resolved:\n                    if item['is_new']:\n                        conn.execute('INSERT INTO order_items(item_id,order_id,product_name,quantity,image_path,availability_status,available_price,discounted_price,unavailable_reason,availability_note,price_confirmation_required,available_at,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',\n                                     (self._next_item_id(conn), str(order_id), item['product_name'], item['quantity'], '', 'بانتظار التوفر', '', '', '', '', '', '', ts))\n                    else:\n                        conn.execute('UPDATE order_items SET product_name=%s,quantity=%s WHERE item_id=%s AND order_id=%s',\n                                     (item['product_name'], item['quantity'], item['item_id'], str(order_id)))\n\n                for item_id in sorted(overlap):\n                    conn.execute('DELETE FROM order_items WHERE item_id=%s AND order_id=%s', (item_id, str(order_id)))\n\n                fresh_items = self._fetch_items(conn, order_id)\n                if not fresh_items:\n                    raise ValueError('لا يمكن حفظ الطلب بدون أي منتج')\n                updates['Product_Name'] = '، '.join(f\"{i['Product_Name']} × {i['Quantity']}\" for i in fresh_items)\n                updates['Quantity'] = sum(int(i.get('Quantity') or 0) for i in fresh_items)\n'''
          text = text.replace(old_block, new_block, 1)
          cloud_path.write_text(text, encoding='utf-8')

          app = app_path.read_text(encoding='utf-8')
          old_call = "    try: order=db.update_order(order_id,fields,products,_current_actor_name())\n"
          new_call = "    deleted_item_ids = data.get(\"deleted_item_ids\") or []\n    if not isinstance(deleted_item_ids, list):\n        return jsonify({\"error\":\"deleted_item_ids يجب أن تكون قائمة\"}),400\n    try: order=db.update_order(order_id,fields,products,_current_actor_name(),deleted_item_ids=deleted_item_ids)\n"
          if app.count(old_call) != 1:
              raise SystemExit('FAIL CLOSED: api_update_order DB call target not found exactly once')
          app = app.replace(old_call, new_call, 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Add P0.1 regression tests
        shell: bash
        run: |
          cat > tests/test_p0_item_update.py <<'PY'
          import ast
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          class P0ItemUpdateSourceTests(unittest.TestCase):
              def test_update_order_no_longer_deletes_all_items(self):
                  source = (ROOT / 'cloud_db.py').read_text(encoding='utf-8')
                  tree = ast.parse(source)
                  method = next(
                      node for node in ast.walk(tree)
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name == 'update_order'
                  )
                  calls = [
                      node for node in ast.walk(method)
                      if isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Attribute)
                      and node.func.attr == 'execute'
                  ]
                  sql_literals = []
                  for call in calls:
                      if not call.args:
                          continue
                      arg = call.args[0]
                      if isinstance(arg, ast.Constant) and isinstance(arg.value, str):
                          sql_literals.append(arg.value.upper())
                  self.assertNotIn('DELETE FROM ORDER_ITEMS WHERE ORDER_ID=%S', sql_literals)
                  self.assertTrue(any(sql.startswith('UPDATE ORDER_ITEMS SET PRODUCT_NAME=%S,QUANTITY=%S') for sql in sql_literals))
                  self.assertTrue(any(sql.startswith('INSERT INTO ORDER_ITEMS') for sql in sql_literals))
                  self.assertTrue(any(sql.startswith('DELETE FROM ORDER_ITEMS WHERE ITEM_ID=%S AND ORDER_ID=%S') for sql in sql_literals))

              def test_update_order_accepts_explicit_deleted_item_ids(self):
                  source = (ROOT / 'app.py').read_text(encoding='utf-8')
                  self.assertIn('deleted_item_ids = data.get("deleted_item_ids") or []', source)
                  self.assertIn('deleted_item_ids=deleted_item_ids', source)

              def test_runtime_update_order_signature_has_delete_channel(self):
                  source = (ROOT / 'cloud_db.py').read_text(encoding='utf-8')
                  self.assertIn("def update_order(self, order_id, fields, products=None, user='موظف', deleted_item_ids=None):", source)

          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Static checks
        run: |
          python -m compileall -q app.py db.py cloud_db.py
          node --check static/app.js
          python -m unittest -v tests/test_p0_item_update.py

      - name: Inspect diff
        run: |
          git diff --check
          git diff -- cloud_db.py app.py tests/test_p0_item_update.py

      - name: Commit verified P0.1 change and remove temporary runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_p0_1_apply.yml
          git add cloud_db.py app.py tests/test_p0_item_update.py .github/workflows/_p0_1_apply.yml
          git commit -m "feat: close P0.1 data-safe item updates"
          git push
