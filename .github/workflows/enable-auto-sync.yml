name: Enable automatic order synchronization

on:
  push:
    branches: [main]

jobs:
  install-auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add five-second data synchronization
        shell: python
        run: |
          from pathlib import Path

          path = Path("static/app.js")
          text = path.read_text(encoding="utf-8")
          marker = "/* === EZZ PHARMACY AUTO SYNC v1 === */"
          if marker in text:
              print("Auto sync already installed.")
              raise SystemExit(0)

          block = r'''

/* === EZZ PHARMACY AUTO SYNC v1 === */
// Keep open browser sessions synchronized without reloading the page.
let _ezzAutoSyncBusy = false;

async function _ezzAutoSync() {
  if (_ezzAutoSyncBusy || document.hidden) return;
  const activeView = document.querySelector('.view.active')?.id || '';
  if (!activeView || activeView === 'view-new-order') return;
  // Do not replace list contents while the user is actively typing.
  const activeElement = document.activeElement;
  if (activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeElement.tagName)) return;

  _ezzAutoSyncBusy = true;
  try {
    if (activeView === 'view-dashboard') {
      await loadDashboard();
    } else if (activeView === 'view-orders') {
      await loadOrders();
    }
  } catch (_) {
    // Normal network interruptions should not disturb the current screen.
  } finally {
    _ezzAutoSyncBusy = false;
  }
}

setInterval(_ezzAutoSync, 5000);
'''

          path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          print("Five-second auto sync added to static/app.js")

      - name: Commit auto sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js
          git commit -m "Add five-second automatic data synchronization"
          git push
