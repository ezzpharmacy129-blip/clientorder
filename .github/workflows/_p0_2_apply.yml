name: P0.2 temporary patch runner

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'p0-1-data-safe-item-update' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply fail-closed P0.2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cloud_db.py')
          text = path.read_text(encoding='utf-8')

          if 'CREATE TABLE IF NOT EXISTS undo_item_images' not in text:
              marker = "CREATE INDEX IF NOT EXISTS idx_undo_order_id ON undo_history(order_id);\n\n"
              insert = '''CREATE INDEX IF NOT EXISTS idx_undo_order_id ON undo_history(order_id);\n\nCREATE TABLE IF NOT EXISTS undo_item_images (\n    undo_id TEXT NOT NULL REFERENCES undo_history(undo_id) ON DELETE CASCADE,\n    item_id TEXT NOT NULL,\n    image_path TEXT NOT NULL,\n    filename TEXT NOT NULL,\n    content_type TEXT NOT NULL,\n    data BYTEA NOT NULL,\n    created_at TEXT NOT NULL,\n    PRIMARY KEY (undo_id, item_id, image_path)\n);\nCREATE INDEX IF NOT EXISTS idx_undo_item_images_undo_id ON undo_item_images(undo_id);\n\n'''
              if text.count(marker) != 1:
                  raise SystemExit('FAIL CLOSED: undo schema insertion marker not found exactly once')
              text = text.replace(marker, insert, 1)

          old_add = '''    def _add_undo(self, conn, order_id, action, snapshot, user):\n        conn.execute('INSERT INTO undo_history(undo_id,order_id,action,snapshot_json,created_at,undone_at,user_name) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                     (self._next_undo_id(conn), str(order_id), action, json.dumps(snapshot, ensure_ascii=False), now_str(), '', _clean_name(user)))\n'''
          new_add = '''    def _add_undo(self, conn, order_id, action, snapshot, user, image_item_ids=None):\n        undo_id = self._next_undo_id(conn)\n        conn.execute('INSERT INTO undo_history(undo_id,order_id,action,snapshot_json,created_at,undone_at,user_name) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                     (undo_id, str(order_id), action, json.dumps(snapshot, ensure_ascii=False), now_str(), '', _clean_name(user)))\n        wanted = {str(x).strip() for x in (image_item_ids or set()) if str(x).strip()}\n        if wanted:\n            rows = conn.execute(\n                'SELECT item_id,image_path,filename,content_type,data,created_at FROM item_images WHERE order_id=%s AND item_id = ANY(%s)',\n                (str(order_id), list(wanted)),\n            ).fetchall()\n            for row in rows:\n                conn.execute('INSERT INTO undo_item_images(undo_id,item_id,image_path,filename,content_type,data,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                             (undo_id, str(row['item_id']), str(row['image_path']), str(row['filename']), str(row['content_type']), psycopg.Binary(bytes(row['data'])), str(row['created_at'])))\n        return undo_id\n'''
          if text.count(old_add) != 1:
              raise SystemExit('FAIL CLOSED: _add_undo target not found exactly once')
          text = text.replace(old_add, new_add, 1)

          old_update_sig = "    def update_order(self, order_id, fields, products=None, user='موظف', deleted_item_ids=None):\n"
          if text.count(old_update_sig) != 1:
              raise SystemExit('FAIL CLOSED: P0.1 update_order signature missing')
          old_update_anchor = '''                fresh_items = self._fetch_items(conn, order_id)\n                if not fresh_items:\n                    raise ValueError('لا يمكن حفظ الطلب بدون أي منتج')\n                updates['Product_Name'] = '، '.join(f"{i['Product_Name']} × {i['Quantity']}" for i in fresh_items)\n                updates['Quantity'] = sum(int(i.get('Quantity') or 0) for i in fresh_items)\n            col_map = {\n'''
          new_update_anchor = '''                fresh_items = self._fetch_items(conn, order_id)\n                if not fresh_items:\n                    raise ValueError('لا يمكن حفظ الطلب بدون أي منتج')\n                updates['Product_Name'] = '، '.join(f"{i['Product_Name']} × {i['Quantity']}" for i in fresh_items)\n                updates['Quantity'] = sum(int(i.get('Quantity') or 0) for i in fresh_items)\n            else:\n                self._add_undo(conn, order_id, 'تعديل بيانات الطلب', snapshot, user)\n            col_map = {\n'''
          if text.count(old_update_anchor) != 1:
              raise SystemExit('FAIL CLOSED: update_order undo placement anchor not found')
          text = text.replace(old_update_anchor, new_update_anchor, 1)
          old_update_undo = "                ts = now_str()\n                for item in resolved:\n"
          new_update_undo = "                self._add_undo(conn, order_id, 'تعديل بيانات الطلب', snapshot, user, image_item_ids=overlap)\n                ts = now_str()\n                for item in resolved:\n"
          if text.count(old_update_undo) != 1:
              raise SystemExit('FAIL CLOSED: update_order pre-mutation undo anchor not found')
          text = text.replace(old_update_undo, new_update_undo, 1)

          old_undo = '''    def undo_last(self, order_id, user='موظف'):\n        with self._connect() as conn:\n            row = conn.execute("SELECT * FROM undo_history WHERE order_id=%s AND COALESCE(undone_at,'')='' ORDER BY created_at DESC LIMIT 1", (str(order_id),)).fetchone()\n            current = self._fetch_order(conn, order_id)\n            if not row:\n                return {'error': 'لا يوجد إجراء يمكن التراجع عنه لهذا الطلب', 'code': 409}\n            if not current:\n                return {'error': 'الطلب غير موجود', 'code': 404}\n            snapshot = json.loads(row['snapshot_json'])\n            order_data = snapshot.get('order', {})\n            sets=[]; params=[]\n            for key, dbkey in [('Customer_Name','customer_name'),('Phone','phone'),('Product_Name','product_name'),('Quantity','quantity'),('Order_Date','order_date'),('Available_Date','available_date'),('Status','status'),('Contact_Status','contact_status'),('Last_Contact_Date','last_contact_date'),('Next_Followup_Date','next_followup_date'),('Pickup_Date','pickup_date'),('Notes','notes'),('Created_At','created_at')]:\n                sets.append(f'{dbkey}=%s'); params.append(order_data.get(key, ''))\n            sets.append('updated_at=%s'); params.append(now_str()); params.append(str(order_id))\n            conn.execute(f"UPDATE orders SET {', '.join(sets)} WHERE order_id=%s", params)\n            conn.execute('DELETE FROM order_items WHERE order_id=%s', (str(order_id),))\n            for item in snapshot.get('items', []):\n                conn.execute('INSERT INTO order_items(item_id,order_id,product_name,quantity,image_path,availability_status,available_price,discounted_price,unavailable_reason,availability_note,price_confirmation_required,available_at,created_at,customer_decision) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',\n                             tuple(item.get(k, '') for k in ('Item_ID','Order_ID','Product_Name','Quantity','Image_Path','Availability_Status','Available_Price','Discounted_Price','Unavailable_Reason','Availability_Note','Price_Confirmation_Required','Available_At','Created_At','Customer_Decision')))\n            conn.execute('UPDATE undo_history SET undone_at=%s WHERE undo_id=%s', (now_str(), row['undo_id']))\n            self._log(conn, order_id, f\"تراجع عن: {row['action']}\", current['Status'], order_data.get('Status',''), 'تم التراجع عن آخر تغيير للمستخدم', user)\n            return {'order': self._refresh_order_in_conn(conn, order_id), 'undone_action': row['action']}\n'''
          new_undo = '''    def undo_last(self, order_id, user='موظف'):\n        with self._connect() as conn:\n            row = conn.execute("SELECT * FROM undo_history WHERE order_id=%s AND COALESCE(undone_at,'')='' ORDER BY created_at DESC LIMIT 1", (str(order_id),)).fetchone()\n            current = self._fetch_order(conn, order_id)\n            if not row:\n                return {'error': 'لا يوجد إجراء يمكن التراجع عنه لهذا الطلب', 'code': 409}\n            if not current:\n                return {'error': 'الطلب غير موجود', 'code': 404}\n\n            snapshot = json.loads(row['snapshot_json'])\n            order_data = snapshot.get('order', {})\n            image_rows = conn.execute(\n                'SELECT item_id,image_path,filename,content_type,data,created_at FROM undo_item_images WHERE undo_id=%s ORDER BY item_id,image_path',\n                (row['undo_id'],),\n            ).fetchall()\n            images_by_item = {}\n            for image in image_rows:\n                images_by_item.setdefault(str(image['item_id']), []).append(image)\n\n            sets=[]; params=[]\n            for key, dbkey in [('Customer_Name','customer_name'),('Phone','phone'),('Product_Name','product_name'),('Quantity','quantity'),('Order_Date','order_date'),('Available_Date','available_date'),('Status','status'),('Contact_Status','contact_status'),('Last_Contact_Date','last_contact_date'),('Next_Followup_Date','next_followup_date'),('Pickup_Date','pickup_date'),('Notes','notes'),('Created_At','created_at')]:\n                sets.append(f'{dbkey}=%s'); params.append(order_data.get(key, ''))\n            sets.append('updated_at=%s'); params.append(now_str()); params.append(str(order_id))\n            conn.execute(f"UPDATE orders SET {', '.join(sets)} WHERE order_id=%s", params)\n\n            snapshot_items = snapshot.get('items', []) or []\n            current_items = self._fetch_items(conn, order_id)\n            current_by_id = {str(item.get('Item_ID')): item for item in current_items if item.get('Item_ID')}\n            snapshot_by_id = {str(item.get('Item_ID')): item for item in snapshot_items if item.get('Item_ID')}\n\n            for item_id in sorted(set(current_by_id) - set(snapshot_by_id)):\n                conn.execute('DELETE FROM order_items WHERE item_id=%s AND order_id=%s', (item_id, str(order_id)))\n\n            for item_id, item in snapshot_by_id.items():\n                values = tuple(item.get(k, '') for k in ('Product_Name','Quantity','Image_Path','Availability_Status','Available_Price','Discounted_Price','Unavailable_Reason','Availability_Note','Price_Confirmation_Required','Available_At','Created_At','Customer_Decision'))\n                if item_id in current_by_id:\n                    conn.execute('UPDATE order_items SET product_name=%s,quantity=%s,image_path=%s,availability_status=%s,available_price=%s,discounted_price=%s,unavailable_reason=%s,availability_note=%s,price_confirmation_required=%s,available_at=%s,created_at=%s,customer_decision=%s WHERE item_id=%s AND order_id=%s', values + (item_id, str(order_id)))\n                else:\n                    conn.execute('INSERT INTO order_items(item_id,order_id,product_name,quantity,image_path,availability_status,available_price,discounted_price,unavailable_reason,availability_note,price_confirmation_required,available_at,created_at,customer_decision) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',\n                                 (item_id, str(order_id), item.get('Product_Name',''), item.get('Quantity',1), item.get('Image_Path',''), item.get('Availability_Status','بانتظار التوفر'), item.get('Available_Price',''), item.get('Discounted_Price',''), item.get('Unavailable_Reason',''), item.get('Availability_Note',''), item.get('Price_Confirmation_Required',''), item.get('Available_At',''), item.get('Created_At') or now_str(), item.get('Customer_Decision','')))\n                expected_path = str(item.get('Image_Path') or '')\n                current_path = str(current_by_id.get(item_id, {}).get('Image_Path') or '')\n                if expected_path != current_path and item_id not in images_by_item:\n                    raise ValueError(f'لا يمكن التراجع بأمان عن الصورة المرتبطة بالمنتج {item_id}: بيانات الصورة السابقة غير محفوظة')\n\n            for item_id, images in images_by_item.items():\n                if item_id not in snapshot_by_id:\n                    raise ValueError(f'صورة Undo مرتبطة بمنتج غير موجود في snapshot: {item_id}')\n                conn.execute('DELETE FROM item_images WHERE order_id=%s AND item_id=%s', (str(order_id), item_id))\n                for image in images:\n                    conn.execute('INSERT INTO item_images(image_path,order_id,item_id,filename,content_type,data,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                                 (str(image['image_path']), str(order_id), item_id, str(image['filename']), str(image['content_type']), psycopg.Binary(bytes(image['data'])), str(image['created_at'])))\n\n            conn.execute('UPDATE undo_history SET undone_at=%s WHERE undo_id=%s', (now_str(), row['undo_id']))\n            self._log(conn, order_id, f\"تراجع عن: {row['action']}\", current['Status'], order_data.get('Status',''), 'تم التراجع عن آخر تغيير للمستخدم', user)\n            return {'order': self._refresh_order_in_conn(conn, order_id), 'undone_action': row['action']}\n'''
          if text.count(old_undo) != 1:
              raise SystemExit('FAIL CLOSED: existing unsafe undo_last block not found exactly once')
          text = text.replace(old_undo, new_undo, 1)

          old_image_set = '''        with self._connect() as conn:\n            item=conn.execute('SELECT product_name,image_path FROM order_items WHERE item_id=%s AND order_id=%s',(str(item_id),str(order_id))).fetchone()\n            if not item: return None\n            if item['image_path']:\n'''
          new_image_set = '''        with self._connect() as conn:\n            item=conn.execute('SELECT product_name,image_path FROM order_items WHERE item_id=%s AND order_id=%s',(str(item_id),str(order_id))).fetchone()\n            if not item: return None\n            snapshot=self._snapshot(conn, order_id)\n            self._invalidate_undo(conn, order_id)\n            self._add_undo(conn, order_id, 'إضافة صورة للمنتج', snapshot, user, image_item_ids={str(item_id)})\n            if item['image_path']:\n'''
          if text.count(old_image_set) != 1:
              raise SystemExit('FAIL CLOSED: set_item_image mutation marker not found')
          text = text.replace(old_image_set, new_image_set, 1)

          old_image_delete = '''        with self._connect() as conn:\n            item=conn.execute('SELECT image_path,product_name FROM order_items WHERE item_id=%s AND order_id=%s',(str(item_id),str(order_id))).fetchone()\n            if not item: return False\n            if not item['image_path']: return True\n            conn.execute('DELETE FROM item_images WHERE image_path=%s',(item['image_path'],))\n'''
          new_image_delete = '''        with self._connect() as conn:\n            item=conn.execute('SELECT image_path,product_name FROM order_items WHERE item_id=%s AND order_id=%s',(str(item_id),str(order_id))).fetchone()\n            if not item: return False\n            if not item['image_path']: return True\n            snapshot=self._snapshot(conn, order_id)\n            self._invalidate_undo(conn, order_id)\n            self._add_undo(conn, order_id, 'حذف صورة المنتج', snapshot, user, image_item_ids={str(item_id)})\n            conn.execute('DELETE FROM item_images WHERE image_path=%s',(item['image_path'],))\n'''
          if text.count(old_image_delete) != 1:
              raise SystemExit('FAIL CLOSED: delete_item_image mutation marker not found')
          text = text.replace(old_image_delete, new_image_delete, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add P0.2 regression tests
        shell: bash
        run: |
          cat > tests/test_p0_undo_safety.py <<'PY'
          import copy
          import json
          import sqlite3
          import unittest
          from contextlib import contextmanager
          from pathlib import Path

          from cloud_db import CloudDB

          ROOT = Path(__file__).resolve().parents[1]

          class FakeRow(dict):
              def __getattr__(self, name):
                  return self[name]

          class FakeCursor:
              def __init__(self, rows):
                  self.rows = rows
              def fetchone(self):
                  return self.rows[0] if self.rows else None
              def fetchall(self):
                  return self.rows

          class FakeConn:
              def __init__(self):
                  self.orders = {
                      'ORD-00001': {
                          'order_id': 'ORD-00001', 'customer_name': 'عميل', 'phone': '0500000000',
                          'product_name': 'دواء أ × 2، دواء ب × 1', 'quantity': 3,
                          'order_date': '2026-09-07', 'available_date': '', 'status': 'متوفر - يحتاج اتصال',
                          'contact_status': 'لم يتم التواصل', 'last_contact_date': '', 'next_followup_date': '',
                          'pickup_date': '', 'notes': 'ملاحظة', 'created_at': '2026-09-07 10:00:00', 'updated_at': '2026-09-07 10:00:00',
                      }
                  }
                  self.items = {
                      'ITEM-000001': {'item_id':'ITEM-000001','order_id':'ORD-00001','product_name':'دواء أ','quantity':2,'image_path':'ORD-00001/ITEM-000001_old.png','availability_status':'متوفر','available_price':'20','discounted_price':'18','unavailable_reason':'','availability_note':'','price_confirmation_required':'','available_at':'2026-09-07','created_at':'2026-09-07 10:00:00','customer_decision':'accepted'},
                      'ITEM-000002': {'item_id':'ITEM-000002','order_id':'ORD-00001','product_name':'دواء ب','quantity':1,'image_path':'ORD-00001/ITEM-000002_old.png','availability_status':'غير متوفر','available_price':'','discounted_price':'','unavailable_reason':'غير متوفر لدى المورد','availability_note':'','price_confirmation_required':'','available_at':'','created_at':'2026-09-07 10:00:01','customer_decision':'rejected'},
                  }
                  self.images = {
                      'ORD-00001/ITEM-000001_old.png': {'image_path':'ORD-00001/ITEM-000001_old.png','order_id':'ORD-00001','item_id':'ITEM-000001','filename':'old.png','content_type':'image/png','data':b'IMAGE-A','created_at':'2026-09-07 10:00:00'},
                      'ORD-00001/ITEM-000002_old.png': {'image_path':'ORD-00001/ITEM-000002_old.png','order_id':'ORD-00001','item_id':'ITEM-000002','filename':'old.png','content_type':'image/png','data':b'IMAGE-B','created_at':'2026-09-07 10:00:01'},
                  }
                  self.undo = []
                  self.undo_images = []
                  self.logs = []
                  self.seq = 100

              def __enter__(self): return self
              def __exit__(self, exc_type, exc, tb): return False

              def _rows_items(self, order_id):
                  return [FakeRow(copy.deepcopy(v)) for v in self.items.values() if v['order_id']==order_id]

              def _rows_images(self, order_id=None, item_id=None):
                  return [FakeRow(copy.deepcopy(v)) for v in self.images.values() if (order_id is None or v['order_id']==order_id) and (item_id is None or v['item_id']==item_id)]

              def execute(self, sql, params=()):
                  s=' '.join(sql.strip().split()).lower()
                  p=list(params)
                  if s.startswith('select * from orders where order_id='):
                      row=self.orders.get(str(p[0])); return FakeCursor([FakeRow(copy.deepcopy(row))] if row else [])
                  if s.startswith('select * from order_items where order_id='):
                      return FakeCursor(self._rows_items(str(p[0])))
                  if s.startswith('select product_name,image_path from order_items where item_id='):
                      iid,oid=str(p[0]),str(p[1]); row=self.items.get(iid)
                      return FakeCursor([FakeRow({'product_name':row['product_name'],'image_path':row['image_path']})] if row and row['order_id']==oid else [])
                  if s.startswith('select image_path, data') or s.startswith('select item_id,image_path,filename,content_type,data,created_at from item_images where order_id='):
                      oid=str(p[0]); return FakeCursor(self._rows_images(order_id=oid))
                  if s.startswith('select item_id,image_path,filename,content_type,data,created_at from item_images where order_id='):
                      oid=str(p[0]); return FakeCursor(self._rows_images(order_id=oid))
                  if s.startswith('select * from undo_history where order_id='):
                      oid=str(p[0]); rows=[FakeRow(copy.deepcopy(x)) for x in self.undo if x['order_id']==oid and not x['undone_at']]
                      rows.sort(key=lambda x:x['created_at'], reverse=True); return FakeCursor(rows[:1])
                  if s.startswith('select item_id,image_path,filename,content_type,data,created_at from undo_item_images where undo_id='):
                      uid=str(p[0]); rows=[FakeRow(copy.deepcopy(x)) for x in self.undo_images if x['undo_id']==uid]; rows.sort(key=lambda x:(x['item_id'],x['image_path'])); return FakeCursor(rows)
                  if s.startswith('select item_id,image_path,filename,content_type,data,created_at from item_images where order_id=%s and item_id = any'):
                      oid=str(p[0]); wanted={str(x) for x in p[1]}; return FakeCursor([FakeRow(copy.deepcopy(v)) for v in self.images.values() if v['order_id']==oid and v['item_id'] in wanted])
                  if s.startswith('insert into undo_history'):
                      uid=str(p[0]); self.undo.append({'undo_id':uid,'order_id':str(p[1]),'action':str(p[2]),'snapshot_json':str(p[3]),'created_at':str(p[4]),'undone_at':str(p[5]),'user_name':str(p[6])}); return FakeCursor([])
                  if s.startswith('insert into undo_item_images'):
                      self.undo_images.append({'undo_id':str(p[0]),'item_id':str(p[1]),'image_path':str(p[2]),'filename':str(p[3]),'content_type':str(p[4]),'data':bytes(p[5]),'created_at':str(p[6])}); return FakeCursor([])
                  if s.startswith('update undo_history set undone_at='):
                      when,uid=str(p[0]),str(p[1]);
                      for x in self.undo:
                          if x['undo_id']==uid: x['undone_at']=when
                      return FakeCursor([])
                  if s.startswith('update order_items set product_name='):
                      vals=p; iid=str(vals[-2]); oid=str(vals[-1]); item=self.items[iid]
                      keys=['product_name','quantity']; item['product_name']=vals[0]; item['quantity']=vals[1]; return FakeCursor([])
                  if s.startswith('update order_items set product_name=%s,quantity=%s,image_path='):
                      vals=p; iid=str(vals[-2]); item=self.items[iid]
                      fields=['product_name','quantity','image_path','availability_status','available_price','discounted_price','unavailable_reason','availability_note','price_confirmation_required','available_at','created_at','customer_decision']
                      for k,v in zip(fields, vals[:-2]): item[k]=v
                      return FakeCursor([])
                  if s.startswith('insert into order_items'):
                      fields=['item_id','order_id','product_name','quantity','image_path','availability_status','available_price','discounted_price','unavailable_reason','availability_note','price_confirmation_required','available_at','created_at','customer_decision']
                      self.items[str(p[0])] = dict(zip(fields, [copy.deepcopy(x) for x in p]))
                      return FakeCursor([])
                  if s.startswith('delete from order_items where item_id='):
                      iid=str(p[0]); oid=str(p[1]); self.items.pop(iid,None); self.images={k:v for k,v in self.images.items() if v['item_id']!=iid}; return FakeCursor([])
                  if s.startswith('delete from item_images where order_id=') and 'item_id=' in s:
                      oid,iid=str(p[0]),str(p[1]); self.images={k:v for k,v in self.images.items() if not (v['order_id']==oid and v['item_id']==iid)}; return FakeCursor([])
                  if s.startswith('delete from item_images where image_path='):
                      path=str(p[0]); self.images.pop(path,None); return FakeCursor([])
                  if s.startswith('insert into item_images'):
                      fields=['image_path','order_id','item_id','filename','content_type','data','created_at']; row=dict(zip(fields,p)); self.images[str(p[0])]=copy.deepcopy(row); return FakeCursor([])
                  if s.startswith('update orders set'):
                      oid=str(p[-1]); row=self.orders[oid]
                      col_names=[]
                      if 'customer_name=%s' in s: col_names.append('customer_name')
                      if 'phone=%s' in s: col_names.append('phone')
                      if 'notes=%s' in s: col_names.append('notes')
                      if 'order_date=%s' in s: col_names.append('order_date')
                      if 'product_name=%s' in s: col_names.append('product_name')
                      if 'quantity=%s' in s: col_names.append('quantity')
                      for name,val in zip(col_names,p): row[name]=val
                      row['updated_at']=p[-2]
                      return FakeCursor([])
                  if s.startswith('insert into activity_log'):
                      self.logs.append(tuple(p)); return FakeCursor([])
                  raise AssertionError(f'Unhandled SQL in fake connection: {sql}')

          @contextmanager
          def fake_connect(conn):
              yield conn

          class P0UndoIntegrationTests(unittest.TestCase):
              def setUp(self):
                  self.conn=FakeConn()
                  self.db=CloudDB.__new__(CloudDB)
                  self.db._connect=lambda: fake_connect(self.conn)
                  self.db._next_undo_id=lambda conn: 'UNDO-TEST'
                  self.db._next_log_id=lambda conn: 'LOG-TEST'
                  self.db._next_item_id=lambda conn: 'ITEM-000003'
                  self.db._log=lambda *args, **kwargs: None

              def test_edit_delete_and_undo_restores_item_metadata_and_images(self):
                  before=copy.deepcopy(self.conn.items)
                  result=self.db.update_order(
                      'ORD-00001', {},
                      products=[{'item_id':'ITEM-000001','product_name':'دواء أ معدل','quantity':5}],
                      user='tester', deleted_item_ids=['ITEM-000002'],
                  )
                  self.assertEqual(result['order']['Items'][0]['Item_ID'], 'ITEM-000001')
                  self.assertNotIn('ITEM-000002', self.conn.items)
                  self.assertIn('ORD-00001/ITEM-000001_old.png', self.conn.images)
                  undo=self.db.undo_last('ORD-00001', user='tester')
                  restored={x['Item_ID']:x for x in undo['order']['Items']}
                  self.assertEqual(restored['ITEM-000001']['Product_Name'], before['ITEM-000001']['product_name'])
                  self.assertEqual(restored['ITEM-000001']['Quantity'], before['ITEM-000001']['quantity'])
                  self.assertEqual(restored['ITEM-000001']['Availability_Status'], before['ITEM-000001']['availability_status'])
                  self.assertEqual(restored['ITEM-000001']['Available_Price'], before['ITEM-000001']['available_price'])
                  self.assertEqual(restored['ITEM-000001']['Customer_Decision'], before['ITEM-000001']['customer_decision'])
                  self.assertEqual(restored['ITEM-000001']['Image_Path'], before['ITEM-000001']['image_path'])
                  self.assertIn('ITEM-000002', restored)
                  self.assertEqual(self.conn.images['ORD-00001/ITEM-000002_old.png']['data'], b'IMAGE-B')

              def test_schema_and_undo_engine_do_not_delete_all_items(self):
                  source=(ROOT/'cloud_db.py').read_text(encoding='utf-8')
                  self.assertIn('CREATE TABLE IF NOT EXISTS undo_item_images', source)
                  self.assertIn('image_item_ids=None', source)
                  start=source.index('    def undo_last(')
                  end=source.index('    def _action(', start)
                  undo_source=source[start:end]
                  self.assertNotIn('DELETE FROM order_items WHERE order_id=%s', undo_source)

          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Static and functional checks
        run: |
          python -m compileall -q app.py db.py cloud_db.py tests/test_p0_undo_safety.py
          node --check static/app.js
          python -m unittest -v tests/test_p0_undo_safety.py
          git diff --check

