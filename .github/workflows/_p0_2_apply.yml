        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_p0_2_apply.yml
          git add cloud_db.py tests/test_p0_undo_safety.py .github/workflows/_p0_2_apply.yml
