name: P0.2 temporary patch runner

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.ref == 'p0-2-data-safe-undo' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Apply P0.2 fail-closed patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud_db.py'); s=p.read_text(encoding='utf-8')

          if 'CREATE TABLE IF NOT EXISTS undo_item_images' not in s:
              mark="CREATE INDEX IF NOT EXISTS idx_undo_order_id ON undo_history(order_id);\n\n"
              add="""CREATE INDEX IF NOT EXISTS idx_undo_order_id ON undo_history(order_id);\n\nCREATE TABLE IF NOT EXISTS undo_item_images (\n    undo_id TEXT NOT NULL REFERENCES undo_history(undo_id) ON DELETE CASCADE,\n    item_id TEXT NOT NULL,\n    image_path TEXT NOT NULL,\n    filename TEXT NOT NULL,\n    content_type TEXT NOT NULL,\n    data BYTEA NOT NULL,\n    created_at TEXT NOT NULL,\n    PRIMARY KEY (undo_id, item_id, image_path)\n);\nCREATE INDEX IF NOT EXISTS idx_undo_item_images_undo_id ON undo_item_images(undo_id);\n\n"""
              if s.count(mark)!=1: raise SystemExit('FAIL CLOSED: undo schema marker')
              s=s.replace(mark,add,1)

          a=s.index('    def _add_undo('); b=s.index('    def get_undo_info(',a)
          new_add="""    def _add_undo(self, conn, order_id, action, snapshot, user, image_item_ids=None):\n        undo_id=self._next_undo_id(conn)\n        conn.execute('INSERT INTO undo_history(undo_id,order_id,action,snapshot_json,created_at,undone_at,user_name) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                     (undo_id,str(order_id),action,json.dumps(snapshot,ensure_ascii=False),now_str(),' ',_clean_name(user)))\n        wanted={str(x).strip() for x in (image_item_ids or set()) if str(x).strip()}\n        if not wanted: return undo_id\n        placeholders=','.join(['%s']*len(wanted))\n        rows=conn.execute(f'SELECT item_id,image_path,filename,content_type,data,created_at FROM item_images WHERE order_id=%s AND item_id IN ({placeholders})',\n                          (str(order_id),*sorted(wanted))).fetchall()\n        for row in rows:\n            conn.execute('INSERT INTO undo_item_images(undo_id,item_id,image_path,filename,content_type,data,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s)',\n                         (undo_id,str(row['item_id']),str(row['image_path']),str(row['filename']),str(row['content_type']),psycopg.Binary(bytes(row['data'])),str(row['created_at'])))\n        return undo_id\n\n"""
          # one normalization is intentionally required: blank undone_at must remain blank, not a space
          new_add=new_add.replace("(undo_id,str(order_id),action,json.dumps(snapshot,ensure_ascii=False),now_str(),' ',_clean_name(user))","(undo_id,str(order_id),action,json.dumps(snapshot,ensure_ascii=False),now_str(),'',_clean_name(user))")
          s=s[:a]+new_add+s[b:]

          anchor="""                fresh_items = self._fetch_items(conn, order_id)\n                if not fresh_items:\n                    raise ValueError('لا يمكن حفظ الطلب بدون أي منتج')\n                updates['Product_Name'] = '، '.join(f\"{i['Product_Name']} × {i['Quantity']}\" for i in fresh_items)\n                updates['Quantity'] = sum(int(i.get('Quantity') or 0) for i in fresh_items)\n            col_map = {\n"""
          repl=anchor.replace("            col_map = {\n","            else:\n                self._add_undo(conn, order_id, 'تعديل بيانات الطلب', snapshot, user)\n            col_map = {\n")
          if s.count(anchor)!=1: raise SystemExit('FAIL CLOSED: update_order undo anchor')
          s=s.replace(anchor,repl,1)
          anchor2="""                ts = now_str()\n                for item in resolved:\n"""
          repl2="""                self._add_undo(conn, order_id, 'تعديل بيانات الطلب', snapshot, user, image_item_ids=overlap)\n                ts = now_str()\n                for item in resolved:\n"""
          if s.count(anchor2)!=1: raise SystemExit('FAIL CLOSED: update_order mutation anchor')
          s=s.replace(anchor2,repl2,1)

          a=s.index('    def undo_last('); b=s.index('    def _action(',a)
          new_undo="""    def undo_last(self, order_id, user='موظف'):\n        with self._connect() as conn:\n            row=conn.execute(\"SELECT * FROM undo_history WHERE order_id=%s AND COALESCE(undone_at,'')='' ORDER BY created_at DESC LIMIT 1\",(str(order_id),)).fetchone()\n            current=self._fetch_order(conn,order_id)\n            if not row: return {'error':'لا يوجد إجراء يمكن التراجع عنه لهذا الطلب','code':409}\n            if not current: return {'error':'الطلب غير موجود','code':404}\n            snapshot=json.loads(row['snapshot_json']); order_data=snapshot.get('order',{})\n            image_rows=conn.execute('SELECT item_id,image_path,filename,content_type,data,created_at FROM undo_item_images WHERE undo_id=%s ORDER BY item_id,image_path',(row['undo_id'],)).fetchall()\n            images_by_item={}\n            for image in image_rows: images_by_item.setdefault(str(image['item_id']),[]).append(image)\n\n            sets=[]; params=[]\n            for key,dbkey in [('Customer_Name','customer_name'),('Phone','phone'),('Product_Name','product_name'),('Quantity','quantity'),('Order_Date','order_date'),('Available_Date','available_date'),('Status','status'),('Contact_Status','contact_status'),('Last_Contact_Date','last_contact_date'),('Next_Followup_Date','next_followup_date'),('Pickup_Date','pickup_date'),('Notes','notes'),('Created_At','created_at')]:\n                sets.append(f'{dbkey}=%s'); params.append(order_data.get(key,''))\n            sets.append('updated_at=%s'); params.append(now_str()); params.append(str(order_id))\n            conn.execute(f\"UPDATE orders SET {', '.join(sets)} WHERE order_id=%s\",params)\n\n            snapshot_items=snapshot.get('items',[]) or []\n            current_items=self._fetch_items(conn,order_id)\n            current_by_id={str(i.get('Item_ID')):i for i in current_items if i.get('Item_ID')}\n            snapshot_by_id={str(i.get('Item_ID')):i for i in snapshot_items if i.get('Item_ID')}\n\n            for item_id in sorted(set(current_by_id)-set(snapshot_by_id)):\n                conn.execute('DELETE FROM order_items WHERE item_id=%s AND order_id=%s',(item_id,str(order_id)))\n\n            fields=('Product_Name','Quantity','Image_Path','Availability_Status','Available_Price','Discounted_Price','Unavailable_Reason','Availability_Note','Price_Confirmation_Required','Available_At','Created_At','Customer_Decision')\n            for item_id,item in snapshot_by_id.items():\n                values=tuple(item.get(k,'') for k in fields)\n                if item_id in current_by_id:\n                    conn.execute('UPDATE order_items SET product_name=%s,quantity=%s,image_path=%s,availability_status=%s,available_price=%s,discounted_price=%s,unavailable_reason=%s,availability_note=%s,price_confirmation_required=%s,available_at=%s,created_at=%s,customer_decision=%s WHERE item_id=%s AND order_id=%s',values+(item_id,str(order_id)))\n                    expected=str(item.get('Image_Path') or ''); actual=str(current_by_id[item_id].get('Image_Path') or '')\n                    if expected!=actual and item_id not in images_by_item:\n                        raise ValueError(f'لا يمكن التراجع بأمان عن الصورة المرتبطة بالمنتج {item_id}: بيانات الصورة السابقة غير محفوظة')\n                else:\n                    conn.execute('INSERT INTO order_items(item_id,order_id,product_name,quantity,image_path,availability_status,available_price,discounted_price,unavailable_reason,availability_note,price_confirmation_required,available_at,created_at,customer_decision) VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s)',(item_id,str(order_id),item.get('Product_Name',''),item.get('Quantity',1),item.get('Image_Path',''),item.get('Availability_Status','بانتظار التوفر'),item.get('Available_Price',''),item.get('Discounted_Price',''),item.get('Unavailable_Reason',''),item.get('Availability_Note',''),item.get('Price_Confirmation_Required',''),item.get('Available_At',''),item.get('Created_At') or now_str(),item.get('Customer_Decision','')))\n                    if item.get('Image_Path') and item_id not in images_by_item:\n                        raise ValueError(f'لا يمكن التراجع بأمان عن الصورة المرتبطة بالمنتج {item_id}: بيانات الصورة السابقة غير محفوظة')\n\n            for item_id,images in images_by_item.items():\n                if item_id not in snapshot_by_id:\n                    raise ValueError(f'صورة Undo مرتبطة بمنتج غير موجود في snapshot: {item_id}')\n                conn.execute('DELETE FROM item_images WHERE order_id=%s AND item_id=%s',(str(order_id),item_id))\n                for image in images:\n                    conn.execute('INSERT INTO item_images(image_path,order_id,item_id,filename,content_type,data,created_at) VALUES (%s,%s,%s,%s,%s,%s,%s)',(str(image['image_path']),str(order_id),item_id,str(image['filename']),str(image['content_type']),psycopg.Binary(bytes(image['data'])),str(image['created_at'])))\n\n            conn.execute('UPDATE undo_history SET undone_at=%s WHERE undo_id=%s',(now_str(),row['undo_id']))\n            self._log(conn,order_id,f\"تراجع عن: {row['action']}\",current['Status'],order_data.get('Status',''),'تم التراجع عن آخر تغيير للمستخدم',user)\n            return {'order':self._refresh_order_in_conn(conn,order_id),'undone_action':row['action']}\n\n"""
          s=s[:a]+new_undo+s[b:]

          old="""            if not item: return None\n            if item['image_path']:\n"""
          new="""            if not item: return None\n            snapshot=self._snapshot(conn, order_id)\n            self._invalidate_undo(conn, order_id)\n            self._add_undo(conn, order_id, 'إضافة صورة للمنتج', snapshot, user, image_item_ids={str(item_id)})\n            if item['image_path']:\n"""
          if s.count(old)!=1: raise SystemExit('FAIL CLOSED: set_item_image marker')
          s=s.replace(old,new,1)

          old="""            if not item: return False\n            if not item['image_path']: return True\n            conn.execute('DELETE FROM item_images WHERE image_path=%s',(item['image_path'],))\n"""
          new="""            if not item: return False\n            if not item['image_path']: return True\n            snapshot=self._snapshot(conn, order_id)\n            self._invalidate_undo(conn, order_id)\n            self._add_undo(conn, order_id, 'حذف صورة المنتج', snapshot, user, image_item_ids={str(item_id)})\n            conn.execute('DELETE FROM item_images WHERE image_path=%s',(item['image_path'],))\n"""
          if s.count(old)!=1: raise SystemExit('FAIL CLOSED: delete_item_image marker')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Add P0.2 tests
        shell: bash
        run: |
          cat > tests/test_p0_undo_safety.py <<'PY'
          import copy
          import json
          import unittest
          from contextlib import contextmanager
          from pathlib import Path
          from cloud_db import CloudDB

          ROOT=Path(__file__).resolve().parents[1]

          class FakeCursor:
              def __init__(self,rows): self.rows=rows
              def fetchone(self): return self.rows[0] if self.rows else None
              def fetchall(self): return self.rows

          class FakeConn:
              def __init__(self):
                  self.orders={'O':{'order_id':'O','customer_name':'C','phone':'P','product_name':'A × 2، B × 1','quantity':3,'order_date':'D','available_date':'','status':'متوفر - يحتاج اتصال','contact_status':'لم يتم التواصل','last_contact_date':'','next_followup_date':'','pickup_date':'','notes':'N','created_at':'T','updated_at':'T'}}
                  self.items={
                      'A':{'item_id':'A','order_id':'O','product_name':'A','quantity':2,'image_path':'O/A.png','availability_status':'متوفر','available_price':'20','discounted_price':'18','unavailable_reason':'','availability_note':'note','price_confirmation_required':'','available_at':'D','created_at':'T','customer_decision':'accepted'},
                      'B':{'item_id':'B','order_id':'O','product_name':'B','quantity':1,'image_path':'O/B.png','availability_status':'غير متوفر','available_price':'','discounted_price':'','unavailable_reason':'no','availability_note':'','price_confirmation_required':'','available_at':'','created_at':'T2','customer_decision':'rejected'}}
                  self.images={'O/A.png':{'image_path':'O/A.png','order_id':'O','item_id':'A','filename':'A.png','content_type':'image/png','data':b'AAA','created_at':'T'},'O/B.png':{'image_path':'O/B.png','order_id':'O','item_id':'B','filename':'B.png','content_type':'image/png','data':b'BBB','created_at':'T2'}}
                  self.undo=[]; self.undo_images=[]
              def __enter__(self): return self
              def __exit__(self,*a): return False
              def execute(self,sql,params=()):
                  s=' '.join(sql.strip().split()).lower(); p=list(params)
                  if s.startswith('select * from orders where order_id='):
                      r=self.orders.get(str(p[0])); return FakeCursor([copy.deepcopy(r)] if r else [])
                  if s.startswith('select * from order_items where order_id='):
                      return FakeCursor([copy.deepcopy(x) for x in self.items.values() if x['order_id']==str(p[0])])
                  if s.startswith('select product_name,image_path from order_items where item_id='):
                      r=self.items.get(str(p[0])); return FakeCursor([{'product_name':r['product_name'],'image_path':r['image_path']}] if r and r['order_id']==str(p[1]) else [])
                  if s.startswith('select item_id,image_path,filename,content_type,data,created_at from item_images where order_id='):
                      oid=str(p[0]); wanted={str(x) for x in p[1:]}; return FakeCursor([copy.deepcopy(x) for x in self.images.values() if x['order_id']==oid and (not wanted or x['item_id'] in wanted)])
                  if s.startswith('select * from undo_history where order_id='):
                      rows=[copy.deepcopy(x) for x in self.undo if x['order_id']==str(p[0]) and not x['undone_at']]; rows.sort(key=lambda x:x['created_at'],reverse=True); return FakeCursor(rows[:1])
                  if s.startswith('select item_id,image_path,filename,content_type,data,created_at from undo_item_images'):
                      return FakeCursor([copy.deepcopy(x) for x in self.undo_images if x['undo_id']==str(p[0])])
                  if s.startswith('insert into undo_history'):
                      self.undo.append({'undo_id':str(p[0]),'order_id':str(p[1]),'action':str(p[2]),'snapshot_json':str(p[3]),'created_at':str(p[4]),'undone_at':str(p[5]),'user_name':str(p[6])}); return FakeCursor([])
                  if s.startswith('insert into undo_item_images'):
                      self.undo_images.append({'undo_id':str(p[0]),'item_id':str(p[1]),'image_path':str(p[2]),'filename':str(p[3]),'content_type':str(p[4]),'data':bytes(p[5]),'created_at':str(p[6])}); return FakeCursor([])
                  if s.startswith('update undo_history set undone_at='):
                      for x in self.undo:
                          if x['undo_id']==str(p[1]): x['undone_at']=str(p[0])
                      return FakeCursor([])
                  if s.startswith('update order_items set product_name=%s,quantity=%s where item_id='):
                      iid,oid=str(p[-2]),str(p[-1]); self.items[iid]['product_name']=p[0]; self.items[iid]['quantity']=p[1]; return FakeCursor([])
                  if s.startswith('update order_items set product_name=%s,quantity=%s,image_path='):
                      iid=str(p[-2]); fields=['product_name','quantity','image_path','availability_status','available_price','discounted_price','unavailable_reason','availability_note','price_confirmation_required','available_at','created_at','customer_decision'];
                      for k,v in zip(fields,p[:-2]): self.items[iid][k]=v
                      return FakeCursor([])
                  if s.startswith('insert into order_items'):
                      fields=['item_id','order_id','product_name','quantity','image_path','availability_status','available_price','discounted_price','unavailable_reason','availability_note','price_confirmation_required','available_at','created_at','customer_decision']; self.items[str(p[0])]=dict(zip(fields,p)); return FakeCursor([])
                  if s.startswith('delete from order_items where item_id='):
                      iid=str(p[0]); self.items.pop(iid,None); self.images={k:v for k,v in self.images.items() if v['item_id']!=iid}; return FakeCursor([])
                  if s.startswith('delete from item_images where order_id='):
                      oid,iid=str(p[0]),str(p[1]); self.images={k:v for k,v in self.images.items() if not(v['order_id']==oid and v['item_id']==iid)}; return FakeCursor([])
                  if s.startswith('update orders set'):
                      oid=str(p[-1]); r=self.orders[oid]; names=[n for n in ['customer_name','phone','product_name','quantity','order_date','available_date','status','contact_status','last_contact_date','next_followup_date','pickup_date','notes','created_at'] if n+'=%s' in s]
                      for n,v in zip(names,p[:-2]): r[n]=v
                      r['updated_at']=p[-2]; return FakeCursor([])
                  if s.startswith('insert into activity_log'): return FakeCursor([])
                  if s.startswith('insert into item_images'):
                      fields=['image_path','order_id','item_id','filename','content_type','data','created_at']; self.images[str(p[0])]=dict(zip(fields,p)); return FakeCursor([])
                  raise AssertionError(sql)

          @contextmanager
          def connctx(c): yield c

          class UndoFunctionalTest(unittest.TestCase):
              def setUp(self):
                  self.c=FakeConn(); self.db=CloudDB.__new__(CloudDB); self.db._connect=lambda:connctx(self.c); self.db._next_undo_id=lambda c:'U1'; self.db._next_log_id=lambda c:'L1'; self.db._next_item_id=lambda c:'C'; self.db._log=lambda *a,**k:None
              def test_edit_delete_undo_restores_item_and_image(self):
                  before=copy.deepcopy(self.c.items)
                  self.db.update_order('O',{},products=[{'item_id':'A','product_name':'A2','quantity':5}],user='tester',deleted_item_ids=['B'])
                  self.assertNotIn('B',self.c.items); self.assertIn('O/A.png',self.c.images)
                  out=self.db.undo_last('O',user='tester'); got={x['Item_ID']:x for x in out['order']['Items']}
                  for field in ('Product_Name','Quantity','Availability_Status','Available_Price','Customer_Decision','Image_Path'):
                      self.assertEqual(got['A'][field],before['A'][{'Product_Name':'product_name','Quantity':'quantity','Availability_Status':'availability_status','Available_Price':'available_price','Customer_Decision':'customer_decision','Image_Path':'image_path'}[field]])
                  self.assertIn('B',got); self.assertEqual(self.c.images['O/B.png']['data'],b'BBB')

          class SourceGuardTest(unittest.TestCase):
              def test_undo_does_not_full_delete_items(self):
                  s=(ROOT/'cloud_db.py').read_text(encoding='utf-8'); a=s.index('    def undo_last('); b=s.index('    def _action(',a); self.assertNotIn('DELETE FROM order_items WHERE order_id=%s',s[a:b])
              def test_undo_image_store_exists(self): self.assertIn('CREATE TABLE IF NOT EXISTS undo_item_images', (ROOT/'cloud_db.py').read_text(encoding='utf-8'))

          if __name__=='__main__': unittest.main()
          PY
      - name: Verify P0.2
        run: |
          python -m compileall -q app.py db.py cloud_db.py tests/test_p0_undo_safety.py
          node --check static/app.js
          python -m unittest -v tests/test_p0_undo_safety.py
          git diff --check
      - name: Commit verified P0.2 and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_p0_2_apply.yml
          git add cloud_db.py tests/test_p0_undo_safety.py .github/workflows/_p0_2_apply.yml
          git commit -m "feat: close P0.2 data-safe undo"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
